# Normalization of conversation turns, applied to each turn in order before
# matching. Spans in vectors/ are over the normalized text of a turn; every
# implementation also maps a normalized span back to the original text, so a
# caller can redact the original.
#
# This file is a contract. The exact behavior of each step is defined in
# spec/README.md ("Normalization"), and vectors/normalize.jsonl holds
# input/output pairs every implementation must reproduce. The JSON Schema is
# spec/schema/normalize.schema.json.
specVersion: "0.6"

steps:
  # "123456789#" -> "123456789": a terminator key right after a digit.
  - strip_keypad_terminator: ["#", "*"]

  # "January first, nineteen eighty" -> "1980-01-01". Runs before number
  # words so that it reads the words as said.
  - spoken_dates_to_iso:
      months:
        january: 1
        jan: 1
        february: 2
        feb: 2
        march: 3
        mar: 3
        april: 4
        apr: 4
        may: 5
        june: 6
        jun: 6
        july: 7
        jul: 7
        august: 8
        aug: 8
        september: 9
        sept: 9
        sep: 9
        october: 10
        oct: 10
        november: 11
        nov: 11
        december: 12
        dec: 12
      ordinals:
        first: 1
        second: 2
        third: 3
        fourth: 4
        fifth: 5
        sixth: 6
        seventh: 7
        eighth: 8
        ninth: 9
        tenth: 10
        eleventh: 11
        twelfth: 12
        thirteenth: 13
        fourteenth: 14
        fifteenth: 15
        sixteenth: 16
        seventeenth: 17
        eighteenth: 18
        nineteenth: 19
        twentieth: 20
        thirtieth: 30
      units: {one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9}
      teens:
        ten: 10
        eleven: 11
        twelve: 12
        thirteen: 13
        fourteen: 14
        fifteen: 15
        sixteen: 16
        seventeen: 17
        eighteen: 18
        nineteen: 19
      tens: {twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90}
      yearRange: [1900, 2099]

  # "four two four two" -> "4 2 4 2"; "double five" -> "55". "oh" and "o"
  # are zero only next to another digit or digit word.
  - number_words_to_digits:
      words: {zero: 0, oh: 0, o: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9}
      zeroOnlyNextToDigits: [oh, o]
      multipliers: {double: 2, triple: 3}

  # "4 5 uh 3 9" -> "4 5 3 9": a filler word between two digits.
  - drop_fillers_between_digits: ["uh", "um", "umm", "er", "erm", "ah", "hmm", "mm"]

  # "4 5 3 9, 1 4 8 8" -> "45391488": separators between two digits, never
  # inside or next to a date (1980-01-01, 7/4/1981).
  - collapse_digit_separators: [" ", "-", ".", ","]

  # Not a text change: a value may continue in the same speaker's next turn.
  - join_same_speaker_turns:
      withinSeconds: 15
      stopWhenClassComplete: true
      # Another speaker's backchannel ("mm-hmm") may come between the parts.
      maxInterveningTurns: 3
      # A keypad answer may be keyed in parts ("0101", then "80#"), but only
      # within one answer window: a value with a part in one of these
      # channels ends at the next turn of another speaker, and never joins
      # across one.
      answerWindowChannels: [dtmf]
      # A bot or agent turn that matches one of these (case-insensitive, ASCII)
      # is a menu or a question, not a backchannel: it ends any value another
      # speaker is still giving. "Thanks. Reply 1 for more." ends a pending
      # date of birth, so the "1" that answers the menu never joins it.
      menuOrQuestionTurns:
        - "\\?"
        - "\\bpress(?:ing)?\\b"
        - "\\breply\\b"
        - "\\bsay\\b"
        - "\\benter\\b"
        - "\\btype\\b"
        - "\\bselect\\b"
        - "\\bchoose\\b"
        - "\\bdial\\b"
        - "\\bmenu\\b"
