AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  sensitive-data-scanner in one account and region: a scheduled Lambda that
  discovers the data stores here and reports findings only, never values. It
  reads with read-only IAM and writes nothing but its own results bucket
  (findings, state, and the exports it starts and deletes). Deployed to every
  account and region of an organizational unit by estate-stackset.yaml.
  No IAM resource has a fixed name, so one account can hold it in many regions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Code }
        Parameters: [ImageUri, CodeS3BucketPrefix, CodeS3Key]
      - Label: { default: What to read }
        Parameters: [Discover, DiscoverAllow, DiscoverDeny, DiscoverSampling, AllowKmsDecrypt]
      - Label: { default: "Exports: RDS, Aurora, large DynamoDB tables" }
        Parameters:
          [RdsExportKmsKeyArn, EnableDynamoDBExport, DynamoDBExportKmsKeyArn]
      - Label: { default: Opt-in read-only SQL (Data API) }
        Parameters: [DataApiTargets, DataApiClusterArns, DataApiSecretArns]
      - Label: { default: "Redshift and Redshift Serverless (opt-in reads)" }
        Parameters: [RedshiftRead, RedshiftDbUser]
      - Label: { default: OpenSearch }
        Parameters: [OpenSearchServerlessRead]
      - Label: { default: EBS snapshots (opt-in block reads) }
        Parameters: [EbsDirectRead]
      - Label: { default: SQS dead-letter queues (opt-in receives) }
        Parameters: [SqsDlqRead]
      - Label: { default: Parameter Store and Secrets Manager }
        Parameters: [SsmDecrypt, SecretsRead]
      - Label: { default: Delivery and schedule }
        Parameters:
          [FindingsEventBusArn, ScheduleExpression, MemorySize, LogRetentionInDays, RunHistoryDays]

Parameters:
  ImageUri:
    Type: String
    Default: ""
    Description: >-
      The container image in ECR in this region (Lambda pulls only from ECR,
      replicated to each region, cross-account pull allowed for the
      organization). Recommended: the image reads Parquet and ORC; the zip
      does not. Leave empty to use the zip.
  CodeS3BucketPrefix:
    Type: String
    Default: ""
    Description: >-
      For the zip: a bucket per region named <prefix>-<region>, readable by
      the organization, holding CodeS3Key.
  CodeS3Key:
    Type: String
    Default: ""
    Description: For the zip, e.g. sensitive-data-scanner-0.3.0-lambda-python3.12-x86_64.zip
  Discover:
    Type: String
    Default: all
    Description: >-
      DISCOVER - all, or any of s3, logs, dynamodb, glue, rds, redshift,
      opensearch, documentdb, neptune, ebs, backup, efs, fsx, kinesis,
      firehose, sqs, ssm, secretsmanager.
  DiscoverAllow:
    Type: String
    Default: ""
    Description: DISCOVER_ALLOW - comma-separated rules (s3:prod-*, tag:pii-scan=yes).
  DiscoverDeny:
    Type: String
    Default: ""
    Description: >-
      DISCOVER_DENY - comma-separated rules. A configuration rule, not an IAM
      boundary: to keep the scanner out of a store for certain, deny it in IAM too.
  DiscoverSampling:
    Type: String
    Default: ""
    Description: DISCOVER_SAMPLING - a JSON list of per-store sampling rules.
  AllowKmsDecrypt:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Allow kms:Decrypt through S3 and DynamoDB only (kms:ViaService), so the
      scanner can read stores encrypted with customer managed keys whose key
      policy allows the account. Without it, those stores are reported as
      kms_access.
  RdsExportKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      The customer's symmetric KMS key for RDS snapshot exports. Setting it
      turns on RDS and Aurora reading and creates the export role.
  EnableDynamoDBExport:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: DYNAMODB_EXPORT - read tables too large to Scan from an Export to S3 (needs PITR).
  DynamoDBExportKmsKeyArn:
    Type: String
    Default: ""
    Description: Optional KMS key for DynamoDB exports (else SSE-S3).
  DataApiTargets:
    Type: String
    Default: ""
    Description: RDS_DATA_API - opt-in JSON list of Aurora clusters to read with read-only SQL.
  DataApiClusterArns:
    Type: CommaDelimitedList
    Default: ""
    Description: The cluster ARNs named in DataApiTargets (for IAM).
  DataApiSecretArns:
    Type: CommaDelimitedList
    Default: ""
    Description: The Secrets Manager secret ARNs named in DataApiTargets (read-only database users).
  RedshiftRead:
    Type: String
    AllowedValues: ["off", iam, db-user]
    Default: "off"
    Description: >-
      REDSHIFT_READ - off (discover and report only), iam (the scanner's IAM
      identity: Redshift maps it to the database user IAMR:<role>, created on
      first use with PUBLIC privileges only; grant it SELECT), or db-user
      (temporary credentials for RedshiftDbUser, an existing read-only user, on
      provisioned clusters; Serverless uses iam). No password is stored.
  RedshiftDbUser:
    Type: String
    Default: ""
    AllowedPattern: "^([A-Za-z_][A-Za-z0-9_$]{0,126})?$"
    Description: REDSHIFT_DB_USER - the existing read-only database user, for RedshiftRead db-user.
  OpenSearchServerlessRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      OPENSEARCH_SERVERLESS_READ - read Serverless collections. IAM's
      aoss:APIAccessAll cannot be narrowed to reads: give the scanner's role
      aoss:ReadDocument (and nothing more) in each collection's data access
      policy. Managed domains are read with es:ESHttpGet only, always.
  EbsDirectRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      EBS_DIRECT_READ - sample each volume's latest snapshot with the EBS
      direct APIs (ListSnapshotBlocks, GetSnapshotBlock): no volume is created
      or attached. Off: volumes and snapshots are discovered and reported.
  SqsDlqRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      SQS_DLQ_READ - receive from dead-letter queues with VisibilityTimeout=0,
      never deleting. A receive raises each message's receive count, so a DLQ
      with its own redrive policy is never read. Live queues are never read.
  SsmDecrypt:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      SSM_DECRYPT - read SecureString parameters, decrypted through SSM
      (kms:Decrypt with kms:ViaService ssm.<region>). Off: they are counted,
      not read.
  SecretsRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      SECRETS_READ - read each secret's value for sensitive data (reported as
      counts, never the value). Off: secrets are listed and reported.
  FindingsEventBusArn:
    Type: String
    Default: ""
    Description: >-
      The central sink: a consumer-owned EventBridge bus whose policy allows
      events:PutEvents from the organization. Empty: findings stay in the
      results bucket.
  ScheduleExpression:
    Type: String
    Default: rate(1 day)
  MemorySize:
    Type: Number
    Default: 3008
    MinValue: 1024
    MaxValue: 10240
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  RunHistoryDays:
    Type: Number
    Default: 90
    Description: Days to keep findings/runs/<runId>.json documents.

Conditions:
  UseImage: !Not [!Equals [!Ref ImageUri, ""]]
  HasBus: !Not [!Equals [!Ref FindingsEventBusArn, ""]]
  KmsDecrypt: !Equals [!Ref AllowKmsDecrypt, "true"]
  RdsExport: !Not [!Equals [!Ref RdsExportKmsKeyArn, ""]]
  DynamoDBExport: !Equals [!Ref EnableDynamoDBExport, "true"]
  DynamoDBExportKey: !And
    - !Condition DynamoDBExport
    - !Not [!Equals [!Ref DynamoDBExportKmsKeyArn, ""]]
  DataApi: !Not [!Equals [!Ref DataApiTargets, ""]]
  RedshiftReads: !Not [!Equals [!Ref RedshiftRead, "off"]]
  RedshiftIam: !Equals [!Ref RedshiftRead, iam]
  RedshiftDbUserMode: !Equals [!Ref RedshiftRead, db-user]
  OpenSearchServerless: !Equals [!Ref OpenSearchServerlessRead, "true"]
  EbsRead: !Equals [!Ref EbsDirectRead, "true"]
  SqsDlq: !Equals [!Ref SqsDlqRead, "true"]
  SsmSecureStrings: !Equals [!Ref SsmDecrypt, "true"]
  SecretsValues: !Equals [!Ref SecretsRead, "true"]

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sds-results-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # The scanner deletes each export once read; this is the backstop.
          - Id: exports-backstop
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 14
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - Id: run-history
            Status: Enabled
            Prefix: findings/runs/
            ExpirationInDays: !Ref RunHistoryDays

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub ${ResultsBucket.Arn}/*
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sensitive-data-scanner
      RetentionInDays: !Ref LogRetentionInDays

  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: sensitive-data-scanner - read-only discovery and reads; writes to its own results bucket only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: scanner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # --- its own results bucket: findings/, state/, exports/
              - Sid: OwnResultsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub ${ResultsBucket.Arn}/*
              - Sid: OwnResultsBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResultsBucket.Arn
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}
              # --- S3: discover the buckets, read the objects
              - Sid: DiscoverS3
                Effect: Allow
                Action: [s3:ListAllMyBuckets, s3:GetBucketTagging]
                Resource: "*"
              - Sid: ReadS3
                Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::*
              - Sid: ReadS3Objects
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: arn:aws:s3:::*/*
              # --- CloudWatch Logs
              - Sid: ReadLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:FilterLogEvents
                  - logs:ListTagsForResource
                Resource: "*"
              # --- DynamoDB
              - Sid: ReadDynamoDB
                Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:ListTagsOfResource
                Resource: "*"
              # --- Glue Data Catalog (Lake Formation: nothing; see the Deny below)
              - Sid: ReadGlueCatalog
                Effect: Allow
                Action: [glue:GetDatabases, glue:GetTables, glue:GetTags]
                Resource: "*"
              # --- RDS and Aurora: describe, to discover and report every store
              - Sid: DescribeRds
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusterSnapshots
                  - rds:DescribeDBSnapshots
                  - rds:DescribeExportTasks
                Resource: "*"
              # --- Redshift and Redshift Serverless: describe, to discover and report
              - Sid: DescribeRedshift
                Effect: Allow
                Action:
                  - redshift:DescribeClusters
                  - redshift-serverless:ListWorkgroups
                  - redshift-serverless:ListNamespaces
                  - redshift-serverless:ListTagsForResource
                Resource: "*"
              # --- OpenSearch: discover domains and collections; read with GET only
              - Sid: DescribeOpenSearch
                Effect: Allow
                Action:
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - es:ListTags
                  - aoss:ListCollections
                  - aoss:BatchGetCollection
                  - aoss:ListTagsForResource
                Resource: "*"
              - Sid: ReadOpenSearchDomains
                Effect: Allow
                Action: es:ESHttpGet
                Resource: !Sub arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/*/*
              - !If
                - OpenSearchServerless
                - Sid: ReadServerlessCollections
                  Effect: Allow
                  Action: aoss:APIAccessAll
                  Resource: !Sub arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
                - !Ref AWS::NoValue
              # --- Snapshots, backups and file systems: discover and report
              - Sid: DescribeSnapshotsBackupsAndFileSystems
                Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - backup:ListBackupVaults
                  - backup:ListRecoveryPointsByBackupVault
                  - backup:ListTags
                  - elasticfilesystem:DescribeFileSystems
                  - fsx:DescribeFileSystems
                  - docdb-elastic:ListClusters
                  - docdb-elastic:ListTagsForResource
                Resource: "*"
              - !If
                - EbsRead
                - Sid: ReadEbsSnapshotBlocks
                  Effect: Allow
                  Action: [ebs:ListSnapshotBlocks, ebs:GetSnapshotBlock]
                  Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*
                - !Ref AWS::NoValue
              - !If
                - EbsRead
                - Sid: DecryptSnapshotsThroughEbs
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService:
                        - !Sub ebs.${AWS::Region}.amazonaws.com
                        - !Sub ec2.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Streams and queues: Kinesis sampled (never checkpointed), Firehose
              # destinations read as S3, SQS listed (dead-letter queues opt-in below)
              - Sid: ReadStreamsAndListQueues
                Effect: Allow
                Action:
                  - kinesis:ListStreams
                  - kinesis:ListShards
                  - kinesis:ListTagsForStream
                  - kinesis:GetShardIterator
                  - kinesis:GetRecords
                  - firehose:ListDeliveryStreams
                  - firehose:DescribeDeliveryStream
                  - firehose:ListTagsForDeliveryStream
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - sqs:ListQueueTags
                Resource: "*"
              - !If
                - SqsDlq
                - Sid: ReceiveFromDeadLetterQueues
                  Effect: Allow
                  Action: sqs:ReceiveMessage
                  Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:*
                - !Ref AWS::NoValue
              - !If
                - SqsDlq
                - Sid: DecryptQueuesThroughSqs
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub sqs.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Parameter Store and Secrets Manager
              - Sid: ListConfigStores
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                  - ssm:ListTagsForResource
                  - secretsmanager:ListSecrets
                Resource: "*"
              - Sid: ReadParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*
              - !If
                - SsmSecureStrings
                - Sid: DecryptParametersThroughSsm
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              - !If
                - SecretsValues
                - Sid: ReadSecretValues
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*
                - !Ref AWS::NoValue
              - !If
                - SecretsValues
                - Sid: DecryptSecretsThroughSecretsManager
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Push findings to the central sink
              - !If
                - HasBus
                - Sid: PushFindings
                  Effect: Allow
                  Action: events:PutEvents
                  Resource: !Ref FindingsEventBusArn
                - !Ref AWS::NoValue
              # --- Customer managed keys, only through S3 and DynamoDB
              - !If
                - KmsDecrypt
                - Sid: DecryptThroughS3AndDynamoDB
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService:
                        - !Sub s3.${AWS::Region}.amazonaws.com
                        - !Sub dynamodb.${AWS::Region}.amazonaws.com
                        - !Sub kinesis.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Defense in depth: never write anywhere else, never escalate
              - Sid: NoWritesOutsideOwnBucket
                Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:PutObjectTagging
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:RestoreObject
                  - s3:ReplicateObject
                  - s3:PutBucket*
                  - s3:DeleteBucket*
                NotResource:
                  - !GetAtt ResultsBucket.Arn
                  - !Sub ${ResultsBucket.Arn}/*
              - Sid: NoDataStoreWrites
                Effect: Deny
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PartiQLDelete
                  - dynamodb:Create*
                  - dynamodb:Delete*
                  - dynamodb:Update*
                  - dynamodb:Restore*
                  - rds:Create*
                  - rds:Delete*
                  - rds:Modify*
                  - rds:Reboot*
                  - rds:Restore*
                  - rds:StopDB*
                  - rds:CancelExportTask
                  - glue:Create*
                  - glue:Update*
                  - glue:Delete*
                  - glue:BatchDelete*
                  - logs:Delete*
                  - logs:PutRetentionPolicy
                  - logs:PutSubscriptionFilter
                  - logs:PutDataProtectionPolicy
                  - redshift:CreateClusterUser
                  - redshift:JoinGroup
                  - redshift:Modify*
                  - redshift:Delete*
                  - redshift:Pause*
                  - redshift:Resume*
                  - redshift:Reboot*
                  - redshift:Restore*
                  - redshift-serverless:Create*
                  - redshift-serverless:Update*
                  - redshift-serverless:Delete*
                  - redshift-serverless:Restore*
                  - redshift-data:BatchExecuteStatement
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpPatch
                  - es:ESHttpDelete
                  - es:Create*
                  - es:Delete*
                  - es:Update*
                  - aoss:Create*
                  - aoss:Update*
                  - aoss:Delete*
                  - ebs:StartSnapshot
                  - ebs:PutSnapshotBlock
                  - ebs:CompleteSnapshot
                  - ec2:CreateSnapshot*
                  - ec2:CreateVolume
                  - ec2:CopySnapshot
                  - ec2:DeleteSnapshot
                  - ec2:DeleteVolume
                  - ec2:ModifySnapshot*
                  - ec2:ModifyVolume*
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - backup:Create*
                  - backup:Delete*
                  - backup:Put*
                  - backup:Start*
                  - backup:Update*
                  - elasticfilesystem:Create*
                  - elasticfilesystem:Delete*
                  - elasticfilesystem:Put*
                  - elasticfilesystem:Update*
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                  - fsx:Create*
                  - fsx:Delete*
                  - fsx:Update*
                  - docdb-elastic:Create*
                  - docdb-elastic:Delete*
                  - docdb-elastic:Update*
                  - kinesis:PutRecord*
                  - kinesis:Create*
                  - kinesis:Delete*
                  - kinesis:Update*
                  - kinesis:MergeShards
                  - kinesis:SplitShard
                  - kinesis:RegisterStreamConsumer
                  - kinesis:*StreamEncryption
                  - kinesis:*RetentionPeriod
                  - firehose:Create*
                  - firehose:Delete*
                  - firehose:Update*
                  - firehose:Put*
                  - firehose:Start*
                  - firehose:Stop*
                  - sqs:DeleteMessage*
                  - sqs:ChangeMessageVisibility*
                  - sqs:SendMessage*
                  - sqs:PurgeQueue
                  - sqs:SetQueueAttributes
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:StartMessageMoveTask
                  - sqs:CancelMessageMoveTask
                  - ssm:PutParameter
                  - ssm:DeleteParameter*
                  - ssm:LabelParameterVersion
                  - ssm:UnlabelParameterVersion
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret*
                  - secretsmanager:DeleteSecret
                  - secretsmanager:RestoreSecret
                  - secretsmanager:RotateSecret
                  - secretsmanager:CancelRotateSecret
                  - secretsmanager:PutResourcePolicy
                  - secretsmanager:DeleteResourcePolicy
                  - secretsmanager:ReplicateSecretToRegions
                  - secretsmanager:RemoveRegionsFromReplication
                  - secretsmanager:StopReplicationToReplica
                Resource: "*"
              - Sid: NeverAskLakeFormation
                Effect: Deny
                Action: lakeformation:*
                Resource: "*"

  # RDS and Aurora snapshot export (only with RdsExportKmsKeyArn)
  RdsExportPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: RdsExport
    Properties:
      RoleName: !Ref ScannerRole
      PolicyName: rds-snapshot-export
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartExports
            Effect: Allow
            Action: rds:StartExportTask
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:*
          - Sid: PassTheExportRoleOnly
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt RdsExportRole.Arn
            Condition:
              StringEquals: { iam:PassedToService: export.rds.amazonaws.com }
          - Sid: GrantOnTheExportKeyOnlyThroughRds
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !Ref RdsExportKmsKeyArn
            Condition:
              StringEquals: { kms:ViaService: !Sub "rds.${AWS::Region}.amazonaws.com" }
              Bool: { kms:GrantIsForAWSResource: "true" }
          - Sid: DescribeTheExportKeyThroughRds
            Effect: Allow
            Action: kms:DescribeKey
            Resource: !Ref RdsExportKmsKeyArn
            Condition:
              StringEquals: { kms:ViaService: !Sub "rds.${AWS::Region}.amazonaws.com" }
          - Sid: ReadTheExport
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref RdsExportKmsKeyArn
            Condition:
              StringEquals: { kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com" }

  RdsExportRole:
    Type: AWS::IAM::Role
    Condition: RdsExport
    Properties:
      Description: Assumed by RDS to write snapshot exports to the scanner's exports/rds/ prefix
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: export.rds.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: write-exports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject*
                  - s3:GetObject*
                  - s3:DeleteObject*
                Resource: !Sub ${ResultsBucket.Arn}/exports/rds/*
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ResultsBucket.Arn

  # DynamoDB Export to S3 (only with EnableDynamoDBExport)
  DynamoDBExportPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: DynamoDBExport
    Properties:
      RoleName: !Ref ScannerRole
      PolicyName: dynamodb-export
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ExportLargeTables
            Effect: Allow
            Action:
              - dynamodb:DescribeContinuousBackups
              - dynamodb:ExportTableToPointInTime
              - dynamodb:DescribeExport
            Resource: "*"
          - !If
            - DynamoDBExportKey
            - Sid: EncryptExportsThroughS3
              Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !Ref DynamoDBExportKmsKeyArn
              Condition:
                StringEquals: { kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com" }
            - !Ref AWS::NoValue

  # Opt-in read-only SQL (only with DataApiTargets)
  DataApiPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: DataApi
    Metadata:
      # The ARN lists default to empty (Split/Join keeps the lint finding here);
      # the policy exists only when DataApiTargets is set, and they with it.
      cfn-lint: { config: { ignore_checks: [W1033] } }
    Properties:
      RoleName: !Ref ScannerRole
      PolicyName: rds-data-api-read-only
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadOnlySqlOnNamedClusters
            Effect: Allow
            Action:
              - rds-data:BeginTransaction
              - rds-data:ExecuteStatement
              - rds-data:RollbackTransaction
            Resource: !Split [",", !Join [",", !Ref DataApiClusterArns]]
          - Sid: NamedSecretsOnly
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Split [",", !Join [",", !Ref DataApiSecretArns]]

  # Redshift reads through the Data API (only with RedshiftRead iam or db-user)
  RedshiftReadPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: RedshiftReads
    Properties:
      RoleName: !Ref ScannerRole
      PolicyName: redshift-read-only-sql
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The statements are the scanner's own sampled SELECTs; the database
          # user's grants (SELECT only) are what make them read-only.
          - Sid: ReadOnlySqlOnRedshift
            Effect: Allow
            Action: [redshift-data:ExecuteStatement, redshift-data:ListDatabases]
            Resource:
              - !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:cluster:*
              - !Sub arn:${AWS::Partition}:redshift-serverless:${AWS::Region}:${AWS::AccountId}:workgroup/*
          - Sid: OwnStatementsOnly
            Effect: Allow
            Action: [redshift-data:DescribeStatement, redshift-data:GetStatementResult]
            Resource: "*"
            Condition:
              StringEquals: { "redshift-data:statement-owner-iam-userid": "${aws:userid}" }
          - Sid: ServerlessIamCredentials
            Effect: Allow
            Action: redshift-serverless:GetCredentials
            Resource: !Sub arn:${AWS::Partition}:redshift-serverless:${AWS::Region}:${AWS::AccountId}:workgroup/*
          - !If
            - RedshiftIam
            - Sid: ClusterIamCredentials
              Effect: Allow
              Action: redshift:GetClusterCredentialsWithIAM
              Resource: !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:dbname:*/*
            - !Ref AWS::NoValue
          - !If
            - RedshiftDbUserMode
            - Sid: ClusterDbUserCredentials
              Effect: Allow
              Action: redshift:GetClusterCredentials
              Resource:
                - !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:dbuser:*/${RedshiftDbUser}
                - !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:dbname:*/*
            - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Metadata:
      # The zip's bucket and key default to empty; they are used only without ImageUri.
      cfn-lint: { config: { ignore_checks: [W1030, W1031] } }
    Properties:
      FunctionName: sensitive-data-scanner
      Description: Finds sensitive data in this account and region; reports findings only
      Role: !GetAtt ScannerRole.Arn
      PackageType: !If [UseImage, Image, Zip]
      Code: !If
        - UseImage
        - ImageUri: !Ref ImageUri
        - S3Bucket: !Sub ${CodeS3BucketPrefix}-${AWS::Region}
          S3Key: !Ref CodeS3Key
      Handler: !If [UseImage, !Ref AWS::NoValue, sensitive_data_scanner.handler.handler]
      Runtime: !If [UseImage, !Ref AWS::NoValue, python3.12]
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      Timeout: 900
      # No reserved concurrency: the results bucket's lock allows one run at a
      # time, and reserving would fail in accounts at the default quota.
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          DISCOVER: !Ref Discover
          DISCOVER_ALLOW: !Ref DiscoverAllow
          DISCOVER_DENY: !Ref DiscoverDeny
          DISCOVER_SAMPLING: !Ref DiscoverSampling
          FINDINGS_EVENT_BUS_ARN: !Ref FindingsEventBusArn
          RDS_EXPORT_ROLE_ARN: !If [RdsExport, !GetAtt RdsExportRole.Arn, ""]
          RDS_EXPORT_KMS_KEY_ARN: !Ref RdsExportKmsKeyArn
          DYNAMODB_EXPORT: !Ref EnableDynamoDBExport
          DYNAMODB_EXPORT_KMS_KEY_ARN: !Ref DynamoDBExportKmsKeyArn
          RDS_DATA_API: !Ref DataApiTargets
          REDSHIFT_READ: !Ref RedshiftRead
          REDSHIFT_DB_USER: !Ref RedshiftDbUser
          OPENSEARCH_SERVERLESS_READ: !Ref OpenSearchServerlessRead
          EBS_DIRECT_READ: !Ref EbsDirectRead
          SQS_DLQ_READ: !Ref SqsDlqRead
          SSM_DECRYPT: !Ref SsmDecrypt
          SECRETS_READ: !Ref SecretsRead

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-scanner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Function.Arn

  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Runs sensitive-data-scanner
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 60
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

Outputs:
  ResultsBucket:
    Value: !Ref ResultsBucket
  FunctionArn:
    Value: !GetAtt Function.Arn
  ScannerRoleArn:
    Description: Grant this role SELECT in Lake Formation to include governed tables
    Value: !GetAtt ScannerRole.Arn
  RdsExportRoleArn:
    Condition: RdsExport
    Value: !GetAtt RdsExportRole.Arn
