  # Never write anywhere else, never escalate, never reveal.
  GuardDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # --- Defense in depth: never write anywhere else, never escalate
          - Sid: NeverRevealOrChangeMacie
            Effect: Deny
            Action:
              - macie2:GetSensitiveDataOccurrences*
              - macie2:GetRevealConfiguration
              - macie2:UpdateRevealConfiguration
              - macie2:Create*
              - macie2:Update*
              - macie2:Delete*
              - macie2:Put*
              - macie2:Enable*
              - macie2:Disable*
              - macie2:Accept*
              - macie2:Decline*
              - macie2:Tag*
              - macie2:Untag*
            Resource: "*"
          - Sid: NoWritesOutsideOwnBucket
            Effect: Deny
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:PutObjectTagging
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:RestoreObject
              - s3:ReplicateObject
              - s3:PutBucket*
              - s3:DeleteBucket*
            NotResource:
              - !GetAtt ResultsBucket.Arn
              - !Sub ${ResultsBucket.Arn}/*
          # Messages are deleted from the scanner's own replay queue only (it takes each
          # replayed event off once read); every other queue's messages stay.
          - Sid: NoMessageDeletesButOwnQueue
            Effect: Deny
            Action: sqs:DeleteMessage*
            NotResource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:sensitive-data-scanner-replay
          # Rules and replays: the scanner's own only, never the customer's.
          - Sid: NoRulesButOwnReplayRules
            Effect: Deny
            Action:
              - events:PutRule
              - events:PutTargets
              - events:RemoveTargets
              - events:DeleteRule
              - events:DisableRule
              - events:EnableRule
            NotResource:
              - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/sensitive-data-scanner-replay-*
              - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*/sensitive-data-scanner-replay-*
          - Sid: NoReplaysButOwn
            Effect: Deny
            Action: events:StartReplay
            NotResource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:replay/sds-*
          # A session that could write is never created (the Allow above asks for
          # ReadOnly too; this holds whatever else the role is given).
          - Sid: NoReadWriteExpressSessions
            Effect: Deny
            Action: s3express:CreateSession
            Resource: "*"
            Condition:
              StringNotEquals: { "s3express:SessionMode": ReadOnly }
          - Sid: NeverAskLakeFormation
            Effect: Deny
            Action: lakeformation:*
            Resource: "*"

  # Opt-in reads of stores and keys, delivery and the Macie import (each statement
  # under its parameter); ListConfigStores and ReadParameters keep it never empty.
  StoreReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # --- its configuration document in SSM, when ConfigLocation names one
          - !If
            - ConfigInSsm
            - Sid: ReadOwnConfigParameter
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sensitive-data-scanner/*
            - !Ref AWS::NoValue
          - !If
            - OpenSearchServerless
            - Sid: ReadServerlessCollections
              Effect: Allow
              Action: aoss:APIAccessAll
              Resource: !Sub arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
            - !Ref AWS::NoValue
          - !If
            - EbsRead
            - Sid: ReadEbsSnapshotBlocks
              Effect: Allow
              Action: [ebs:ListSnapshotBlocks, ebs:GetSnapshotBlock]
              Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*
            - !Ref AWS::NoValue
          - !If
            - EbsRead
            - Sid: DecryptSnapshotsThroughEbs
              Effect: Allow
              Action: kms:Decrypt
              Resource: !If [KmsKeyAllowList, !Ref KmsAllowedKeyArns, "*"]
              Condition:
                StringEquals:
                  kms:ViaService:
                    - !Sub ebs.${AWS::Region}.amazonaws.com
                    - !Sub ec2.${AWS::Region}.amazonaws.com
            - !Ref AWS::NoValue
          - !If
            - SqsDlq
            - Sid: ReceiveFromDeadLetterQueues
              Effect: Allow
              Action: sqs:ReceiveMessage
              Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:*
            - !Ref AWS::NoValue
          - !If
            - SqsDlq
            - Sid: DecryptQueuesThroughSqs
              Effect: Allow
              Action: kms:Decrypt
              Resource: !If [KmsKeyAllowList, !Ref KmsAllowedKeyArns, "*"]
              Condition:
                StringEquals:
                  kms:ViaService: !Sub sqs.${AWS::Region}.amazonaws.com
            - !Ref AWS::NoValue
          # --- Parameter Store and Secrets Manager
          - Sid: ListConfigStores
            Effect: Allow
            Action:
              - ssm:DescribeParameters
              - ssm:ListTagsForResource
              - secretsmanager:ListSecrets
            Resource: "*"
          - Sid: ReadParameters
            Effect: Allow
            Action: ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*
          - !If
            - SsmSecureStrings
            - Sid: DecryptParametersThroughSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: !If [KmsKeyAllowList, !Ref KmsAllowedKeyArns, "*"]
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
            - !Ref AWS::NoValue
          - !If
            - SecretsValues
            - Sid: ReadSecretValues
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*
            - !Ref AWS::NoValue
          - !If
            - SecretsValues
            - Sid: DecryptSecretsThroughSecretsManager
              Effect: Allow
              Action: kms:Decrypt
              Resource: !If [KmsKeyAllowList, !Ref KmsAllowedKeyArns, "*"]
              Condition:
                StringEquals:
                  kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
            - !Ref AWS::NoValue
          # --- Which KMS keys are AWS managed (alias/aws/*), to tell each store's
          # at-rest key apart (#35). Metadata only: no key is described or used.
          - Sid: ListKmsAliases
            Effect: Allow
            Action: kms:ListAliases
            Resource: "*"
          # --- Push findings to the central sink
          - !If
            - HasBus
            - Sid: PushFindings
              Effect: Allow
              Action: events:PutEvents
              Resource: !Ref FindingsEventBusArn
            - !Ref AWS::NoValue
          # --- Customer managed keys, only through the services that read them
          - !If
            - KmsDecrypt
            - Sid: DecryptThroughS3AndDynamoDB
              Effect: Allow
              Action: kms:Decrypt
              Resource: !If [KmsKeyAllowList, !Ref KmsAllowedKeyArns, "*"]
              Condition:
                StringEquals:
                  kms:ViaService:
                    - !Sub s3.${AWS::Region}.amazonaws.com
                    - !Sub dynamodb.${AWS::Region}.amazonaws.com
                    - !Sub kinesis.${AWS::Region}.amazonaws.com
                    - !Sub states.${AWS::Region}.amazonaws.com
                    - !Sub lambda.${AWS::Region}.amazonaws.com
                    - !Sub xray.${AWS::Region}.amazonaws.com
                    - !Sub codecommit.${AWS::Region}.amazonaws.com
                    # A log group under a customer managed key: CloudWatch Logs decrypts
                    # its events with the caller's credentials (#94).
                    - !Sub logs.${AWS::Region}.amazonaws.com
            - !Ref AWS::NoValue
          - !If
            - MacieImport
            - Sid: ReadMacieFindings
              Effect: Allow
              Action:
                - macie2:GetMacieSession
                - macie2:ListFindings
                - macie2:GetFindings
              Resource: "*"
            - !Ref AWS::NoValue

  # Brokers, images, graphs and archives: discovery, and the opt-in reads.
  BrokerImageGraphReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # --- Brokers: MSK and Amazon MQ, discovered and reported; reads opt-in below
          - Sid: DescribeBrokers
            Effect: Allow
            Action: [kafka:ListClustersV2, mq:ListBrokers, mq:DescribeBroker]
            Resource: "*"
          - !If
            - MskReads
            - Sid: MskBootstrapBrokers
              Effect: Allow
              Action: kafka:GetBootstrapBrokers
              Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/*/*
            - !Ref AWS::NoValue
          - !If
            - MskReads
            - Sid: ConnectToMskClusters
              Effect: Allow
              Action: [kafka-cluster:Connect, kafka-cluster:DescribeCluster]
              Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/*/*
            - !Ref AWS::NoValue
          - !If
            - MskReads
            - Sid: ReadMskTopics
              Effect: Allow
              Action: [kafka-cluster:DescribeTopic, kafka-cluster:ReadData]
              Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/*/*/*
            - !Ref AWS::NoValue
          # Its own throwaway groups only, and only to describe them (the consumer
          # asks for their committed offsets; there are none, and AlterGroup is denied).
          - !If
            - MskReads
            - Sid: DescribeOwnThrowawayGroups
              Effect: Allow
              Action: kafka-cluster:DescribeGroup
              Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/*/*/sensitive-data-scanner-*
            - !Ref AWS::NoValue
          - !If
            - MqReads
            - Sid: CheckMqUsers
              Effect: Allow
              Action: [mq:DescribeUser, mq:DescribeConfigurationRevision]
              Resource:
                - !Sub arn:${AWS::Partition}:mq:${AWS::Region}:${AWS::AccountId}:broker:*
                - !Sub arn:${AWS::Partition}:mq:${AWS::Region}:${AWS::AccountId}:configuration:*
            - !Ref AWS::NoValue
          - !If
            - MqReads
            - Sid: ReadMqUserSecrets
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref MqSecretArns
            - !Ref AWS::NoValue
          # --- Images, ML, graphs and archives: discovered and reported (#35)
          - Sid: DescribeImagesMlGraphsAndArchives
            Effect: Allow
            Action:
              - ecr:DescribeRepositories
              - ecr:ListTagsForResource
              - sagemaker:ListFeatureGroups
              - sagemaker:DescribeFeatureGroup
              - sagemaker:ListNotebookInstances
              - sagemaker:ListTags
              - neptune-graph:ListGraphs
              - neptune-graph:ListTagsForResource
              - events:ListArchives
              - events:DescribeArchive
              - glacier:ListVaults
              - glacier:ListTagsForVault
            Resource: "*"
          - !If
            - EcrReads
            - Sid: ReadEcrImageLayers
              Effect: Allow
              Action: [ecr:DescribeImages, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
              Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*
            - !Ref AWS::NoValue
          - !If
            - NeptuneGraphExport
            - Sid: StartGraphExports
              Effect: Allow
              Action: neptune-graph:StartExportTask
              Resource: !Sub arn:${AWS::Partition}:neptune-graph:${AWS::Region}:${AWS::AccountId}:graph/*
            - !Ref AWS::NoValue
          - !If
            - NeptuneGraphExport
            - Sid: WatchGraphExports
              Effect: Allow
              Action: neptune-graph:GetExportTask
              Resource: !Sub arn:${AWS::Partition}:neptune-graph:${AWS::Region}:${AWS::AccountId}:export-task/*
            - !Ref AWS::NoValue
          - !If
            - NeptuneGraphExport
            - Sid: PassTheGraphExportRoleOnly
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt NeptuneGraphExportRole.Arn
              Condition:
                StringEquals: { iam:PassedToService: neptune-graph.amazonaws.com }
            - !Ref AWS::NoValue
          - !If
            - NeptuneGraphExport
            - Sid: ReadTheGraphExport
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref NeptuneAnalyticsExportKmsKeyArn
              Condition:
                StringEquals: { kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com" }
            - !Ref AWS::NoValue
          # An archive is read only by a replay: to a rule of the scanner's own on the
          # archive's bus, which sends only its replays to its own queue.
          - !If
            - EventBridgeReplays
            - Sid: OwnReplayRules
              Effect: Allow
              Action: [events:PutRule, events:PutTargets, events:RemoveTargets, events:DeleteRule]
              Resource:
                - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/sensitive-data-scanner-replay-*
                - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*/sensitive-data-scanner-replay-*
            - !Ref AWS::NoValue
          - !If
            - EventBridgeReplays
            - Sid: StartOwnReplays
              Effect: Allow
              Action: [events:StartReplay, events:DescribeReplay]
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:replay/sds-*
            - !Ref AWS::NoValue
          - !If
            - EventBridgeReplays
            - Sid: OwnReplayQueue
              Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage]
              Resource: !GetAtt ReplayQueue.Arn
            - !Ref AWS::NoValue

  # Neptune Analytics export (only with NeptuneAnalyticsExportKmsKeyArn)
  NeptuneGraphExportRole:
    Type: AWS::IAM::Role
    Condition: NeptuneGraphExport
    Properties:
      Description: Assumed by Neptune Analytics to write graph exports to the scanner's exports/neptune-graph/ prefix
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: neptune-graph.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: write-graph-exports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub ${ResultsBucket.Arn}/exports/neptune-graph/*
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ResultsBucket.Arn
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt, kms:DescribeKey]
                Resource: !Ref NeptuneAnalyticsExportKmsKeyArn

  # The scanner's own queue for EventBridge replays (only with EventBridgeReplay)
  ReplayQueue:
    Type: AWS::SQS::Queue
    Condition: EventBridgeReplays
    Properties:
      QueueName: sensitive-data-scanner-replay
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600

  ReplayQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: EventBridgeReplays
    Properties:
      Queues: [!Ref ReplayQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyTheScannersReplayRules
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ReplayQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/sensitive-data-scanner-replay-*
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*/sensitive-data-scanner-replay-*

  # RDS and Aurora snapshot export (only with RdsExportKmsKeyArn)
  RdsExportPermissions:
    Type: AWS::IAM::ManagedPolicy
    Condition: RdsExport
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartExports
            Effect: Allow
            Action: rds:StartExportTask
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster-snapshot:*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:*
          - Sid: PassTheExportRoleOnly
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt RdsExportRole.Arn
            # StartExportTask evaluates the PassRole for RDS (`rds.amazonaws.com`), not for
            # the export role's trust principal: conditioned on `export.rds.amazonaws.com`
            # alone, every export was denied in a real account (#94). Either value still
            # names RDS, and the resource is the export role only.
            Condition:
              StringEquals:
                iam:PassedToService: [rds.amazonaws.com, export.rds.amazonaws.com]
          - Sid: GrantOnTheExportKeyOnlyThroughRds
            Effect: Allow
            Action: kms:CreateGrant
            Resource: !Ref RdsExportKmsKeyArn
            Condition:
              StringEquals: { kms:ViaService: !Sub "rds.${AWS::Region}.amazonaws.com" }
              Bool: { kms:GrantIsForAWSResource: "true" }
          - Sid: DescribeTheExportKeyThroughRds
            Effect: Allow
            Action: kms:DescribeKey
            Resource: !Ref RdsExportKmsKeyArn
            Condition:
              StringEquals: { kms:ViaService: !Sub "rds.${AWS::Region}.amazonaws.com" }
          - Sid: ReadTheExport
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref RdsExportKmsKeyArn
            Condition:
              StringEquals: { kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com" }

  RdsExportRole:
    Type: AWS::IAM::Role
    Condition: RdsExport
    Properties:
      Description: Assumed by RDS to write snapshot exports to the scanner's exports/rds/ prefix
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: export.rds.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: write-exports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject*
                  - s3:GetObject*
                  - s3:DeleteObject*
                Resource: !Sub ${ResultsBucket.Arn}/exports/rds/*
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ResultsBucket.Arn

  # DynamoDB Export to S3 (only with EnableDynamoDBExport)
  DynamoDBExportPermissions:
    Type: AWS::IAM::ManagedPolicy
    Condition: DynamoDBExport
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ExportLargeTables
            Effect: Allow
            Action:
              - dynamodb:DescribeContinuousBackups
              - dynamodb:ExportTableToPointInTime
              - dynamodb:DescribeExport
            Resource: "*"
          - !If
            - DynamoDBExportKey
            - Sid: EncryptExportsThroughS3
              Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !Ref DynamoDBExportKmsKeyArn
              Condition:
                StringEquals: { kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com" }
            - !Ref AWS::NoValue

  # Opt-in read-only SQL (only with DataApiTargets)
  DataApiPermissions:
    Type: AWS::IAM::ManagedPolicy
    Condition: DataApi
    Metadata:
      # The ARN lists default to empty (Split/Join keeps the lint finding here);
      # the policy exists only when DataApiTargets is set, and they with it.
      cfn-lint: { config: { ignore_checks: [W1033] } }
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadOnlySqlOnNamedClusters
            Effect: Allow
            Action:
              - rds-data:BeginTransaction
              - rds-data:ExecuteStatement
              - rds-data:RollbackTransaction
            Resource: !Split [",", !Join [",", !Ref DataApiClusterArns]]
          - Sid: NamedSecretsOnly
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Split [",", !Join [",", !Ref DataApiSecretArns]]

  # Redshift reads through the Data API (only with RedshiftRead iam or db-user)
  RedshiftReadPermissions:
    Type: AWS::IAM::ManagedPolicy
    Condition: RedshiftReads
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The statements are the scanner's own sampled SELECTs; the database
          # user's grants (SELECT only) are what make them read-only.
          - Sid: ReadOnlySqlOnRedshift
            Effect: Allow
            Action: [redshift-data:ExecuteStatement, redshift-data:ListDatabases]
            Resource:
              - !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:cluster:*
              - !Sub arn:${AWS::Partition}:redshift-serverless:${AWS::Region}:${AWS::AccountId}:workgroup/*
          - Sid: OwnStatementsOnly
            Effect: Allow
            Action: [redshift-data:DescribeStatement, redshift-data:GetStatementResult]
            Resource: "*"
            Condition:
              StringEquals: { "redshift-data:statement-owner-iam-userid": "${aws:userid}" }
          - Sid: ServerlessIamCredentials
            Effect: Allow
            Action: redshift-serverless:GetCredentials
            Resource: !Sub arn:${AWS::Partition}:redshift-serverless:${AWS::Region}:${AWS::AccountId}:workgroup/*
          - !If
            - RedshiftIam
            - Sid: ClusterIamCredentials
              Effect: Allow
              Action: redshift:GetClusterCredentialsWithIAM
              Resource: !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:dbname:*/*
            - !Ref AWS::NoValue
          - !If
            - RedshiftDbUserMode
            - Sid: ClusterDbUserCredentials
              Effect: Allow
              Action: redshift:GetClusterCredentials
              Resource:
                - !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:dbuser:*/${RedshiftDbUser}
                - !Sub arn:${AWS::Partition}:redshift:${AWS::Region}:${AWS::AccountId}:dbname:*/*
            - !Ref AWS::NoValue

  # The function in the customer's VPC (#105, opt-in): what Lambda needs to place and remove
  # its network interfaces there, as AWSLambdaVPCAccessExecutionRole grants it. Nothing else.
  VpcNetworkInterfacePermissions:
    Type: AWS::IAM::ManagedPolicy
    Condition: VpcAttached
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaVpcNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: "*"

  # The zip's code signing (CodeSigningProfileVersionArn): Lambda refuses a zip
  # that this profile version did not sign, or that was changed after signing.
  CodeSigningConfig:
    Type: AWS::Lambda::CodeSigningConfig
    Condition: SignedZip
    Properties:
      Description: sensitive-data-scanner's zip must be signed by the release's signing profile
      AllowedPublishers:
        SigningProfileVersionArns: [!Ref CodeSigningProfileVersionArn]
      CodeSigningPolicies:
        UntrustedArtifactOnDeployment: Enforce

  Function:
    Type: AWS::Lambda::Function
    # The role holds these already (ManagedPolicyArns); named here too, so the function
    # never runs as the role without its Denies. The conditional ones come with the role.
    DependsOn:
      - LogGroup
      - DataStoreWriteDenyPolicy
      - GuardDenyPolicy
      - StoreReadPolicy
      - BrokerImageGraphReadPolicy
    Metadata:
      # The zip's bucket and key default to empty; they are used only without ImageUri.
      cfn-lint: { config: { ignore_checks: [W1030, W1031] } }
    Properties:
      FunctionName: sensitive-data-scanner
      Description: Finds sensitive data in this account and region; reports findings only
      Role: !GetAtt ScannerRole.Arn
      PackageType: !If [UseImage, Image, Zip]
      Code: !If
        - UseImage
        - ImageUri: !Ref ImageUri
        - S3Bucket: !Sub ${CodeS3BucketPrefix}-${AWS::Region}
          S3Key: !Ref CodeS3Key
      CodeSigningConfigArn: !If [SignedZip, !GetAtt CodeSigningConfig.CodeSigningConfigArn, !Ref AWS::NoValue]
      Handler: !If [UseImage, !Ref AWS::NoValue, sensitive_data_scanner.handler.handler]
      Runtime: !If [UseImage, !Ref AWS::NoValue, python3.12]
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      Timeout: 900
      VpcConfig: !If
        - VpcAttached
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      # No reserved concurrency: the results bucket's lock allows one run at a
      # time, and reserving would fail in accounts at the default quota.
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          DISCOVER: !Ref Discover
          DISCOVER_ALLOW: !Ref DiscoverAllow
          DISCOVER_DENY: !Ref DiscoverDeny
          DISCOVER_SAMPLING: !Ref DiscoverSampling
          FINDINGS_EVENT_BUS_ARN: !Ref FindingsEventBusArn
          RDS_EXPORT_ROLE_ARN: !If [RdsExport, !GetAtt RdsExportRole.Arn, ""]
          RDS_EXPORT_KMS_KEY_ARN: !Ref RdsExportKmsKeyArn
          DYNAMODB_EXPORT: !Ref EnableDynamoDBExport
          DYNAMODB_EXPORT_KMS_KEY_ARN: !Ref DynamoDBExportKmsKeyArn
          RDS_DATA_API: !Ref DataApiTargets
          REDSHIFT_READ: !Ref RedshiftRead
          REDSHIFT_DB_USER: !Ref RedshiftDbUser
          OPENSEARCH_SERVERLESS_READ: !Ref OpenSearchServerlessRead
          CONFIG_LOCATION: !Ref ConfigLocation
          EBS_DIRECT_READ: !Ref EbsDirectRead
          SQS_DLQ_READ: !Ref SqsDlqRead
          SSM_DECRYPT: !Ref SsmDecrypt
          SECRETS_READ: !Ref SecretsRead
          KMS_ALLOWED_KEY_ARNS: !Join [",", !Ref KmsAllowedKeyArns]
          MAX_EXPORTS_PER_RUN: !Ref MaxExportsPerRun
          EXPORT_MIN_INTERVAL_DAYS: !Ref ExportMinIntervalDays
          GLUE_LAKE_FORMATION: !Ref GlueLakeFormation
          TIMESTREAM_READ: !Ref TimestreamRead
          KEYSPACES_READ: !Ref KeyspacesRead
          FILESYSTEM_TASK_ENABLED: !Ref FilesystemTaskEnabled
          VPC_SUBNET_IDS: !Join [",", !Ref VpcSubnetIds]
          VPC_SECURITY_GROUP_IDS: !Join [",", !Ref VpcSecurityGroupIds]
          SCAN_MODE: !Ref ScanMode
          MSK_READ: !Ref MskRead
          MQ_READ: !Ref MqRead
          MQ_BROKERS: !Ref MqBrokers
          ECR_READ: !Ref EcrRead
          SAGEMAKER_READ: !Ref SageMakerRead
          NEPTUNE_ANALYTICS_EXPORT_ROLE_ARN: !If [NeptuneGraphExport, !GetAtt NeptuneGraphExportRole.Arn, ""]
          NEPTUNE_ANALYTICS_EXPORT_KMS_KEY_ARN: !Ref NeptuneAnalyticsExportKmsKeyArn
          EVENTBRIDGE_REPLAY: !Ref EventBridgeReplay
          EVENTBRIDGE_REPLAY_QUEUE_URL: !If [EventBridgeReplays, !Ref ReplayQueue, ""]
          EVENTBRIDGE_REPLAY_QUEUE_ARN: !If [EventBridgeReplays, !GetAtt ReplayQueue.Arn, ""]

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-scanner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Function.Arn

  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Runs sensitive-data-scanner
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 60
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

Outputs:
  ResultsBucket:
    Value: !Ref ResultsBucket
  FunctionArn:
    Value: !GetAtt Function.Arn
  ScannerRoleArn:
    Description: Grant this role SELECT in Lake Formation to include governed tables
    Value: !GetAtt ScannerRole.Arn
  RdsExportRoleArn:
    Condition: RdsExport
    Value: !GetAtt RdsExportRole.Arn
