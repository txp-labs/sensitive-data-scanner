AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  sensitive-data-scanner in one account and region: a scheduled Lambda that
  discovers the data stores here and reports findings only, never values. It
  reads with read-only IAM and writes nothing but its own results bucket
  (findings, state, and the exports it starts and deletes). Deployed to every
  account and region of an organizational unit by estate-stackset.yaml.
  No IAM resource has a fixed name, so one account can hold it in many regions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Code }
        Parameters: [ImageUri, CodeS3BucketPrefix, CodeS3Key]
      - Label: { default: What to read }
        Parameters:
          [Discover, DiscoverAllow, DiscoverDeny, DiscoverSampling, AllowKmsDecrypt, ConfigLocation]
      - Label: { default: "Exports: RDS, Aurora, large DynamoDB tables" }
        Parameters:
          [RdsExportKmsKeyArn, EnableDynamoDBExport, DynamoDBExportKmsKeyArn]
      - Label: { default: Opt-in read-only SQL (Data API) }
        Parameters: [DataApiTargets, DataApiClusterArns, DataApiSecretArns]
      - Label: { default: "Redshift and Redshift Serverless (opt-in reads)" }
        Parameters: [RedshiftRead, RedshiftDbUser]
      - Label: { default: OpenSearch }
        Parameters: [OpenSearchServerlessRead]
      - Label: { default: EBS snapshots (opt-in block reads) }
        Parameters: [EbsDirectRead]
      - Label: { default: SQS dead-letter queues (opt-in receives) }
        Parameters: [SqsDlqRead]
      - Label: { default: Parameter Store and Secrets Manager }
        Parameters: [SsmDecrypt, SecretsRead]
      - Label: { default: "Brokers: MSK and Amazon MQ (opt-in reads)" }
        Parameters: [MskRead, MqRead, MqBrokers, MqSecretArns]
      - Label: { default: "Images, ML, graphs and archives (opt-in reads)" }
        Parameters: [EcrRead, SageMakerRead, NeptuneAnalyticsExportKmsKeyArn, EventBridgeReplay]
      - Label: { default: "Who finds the data: this scanner, Amazon Macie, or both (#55)" }
        Parameters: [ScanMode]
      - Label: { default: Delivery and schedule }
        Parameters:
          [FindingsEventBusArn, ScheduleExpression, MemorySize, LogRetentionInDays, RunHistoryDays]

Parameters:
  ImageUri:
    Type: String
    Default: ""
    Description: >-
      The container image in ECR in this region (Lambda pulls only from ECR,
      replicated to each region, cross-account pull allowed for the
      organization). Recommended: the image reads Parquet and ORC; the zip
      does not. Leave empty to use the zip.
  CodeS3BucketPrefix:
    Type: String
    Default: ""
    Description: >-
      For the zip: a bucket per region named <prefix>-<region>, readable by
      the organization, holding CodeS3Key.
  CodeS3Key:
    Type: String
    Default: ""
    Description: For the zip, e.g. sensitive-data-scanner-0.3.0-lambda-python3.12-x86_64.zip
  Discover:
    Type: String
    Default: all
    Description: >-
      DISCOVER - all, or any of s3, logs, dynamodb, glue, rds, redshift,
      opensearch, documentdb, neptune, ebs, backup, efs, fsx, kinesis,
      firehose, sqs, ssm, secretsmanager, elasticache, memorydb, timestream,
      keyspaces, stepfunctions, lambda, xray, codecommit, s3express, msk, mq,
      ecr, sagemaker, neptune-analytics, eventbridge, glacier.
  DiscoverAllow:
    Type: String
    Default: ""
    Description: DISCOVER_ALLOW - comma-separated rules (s3:prod-*, tag:pii-scan=yes).
  DiscoverDeny:
    Type: String
    Default: ""
    Description: >-
      DISCOVER_DENY - comma-separated rules. A configuration rule, not an IAM
      boundary: to keep the scanner out of a store for certain, deny it in IAM too.
  DiscoverSampling:
    Type: String
    Default: ""
    Description: DISCOVER_SAMPLING - a JSON list of per-store sampling rules.
  ConfigLocation:
    Type: String
    Default: ""
    AllowedPattern: "^(|s3://.+|ssm:/sensitive-data-scanner/.+)$"
    Description: >-
      CONFIG_LOCATION - a JSON configuration document beyond Lambda's 4 KB of
      environment variables (docs/ARCHITECTURE.md, Configuration): an S3 object
      (s3://bucket/key) or an SSM parameter under /sensitive-data-scanner/
      (ssm:/sensitive-data-scanner/<name>). It wins over the settings above.
  AllowKmsDecrypt:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Allow kms:Decrypt through S3 and DynamoDB only (kms:ViaService), so the
      scanner can read stores encrypted with customer managed keys whose key
      policy allows the account. Without it, those stores are reported as
      kms_access.
  RdsExportKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      The customer's symmetric KMS key for RDS snapshot exports. Setting it
      turns on RDS and Aurora reading and creates the export role.
  EnableDynamoDBExport:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: DYNAMODB_EXPORT - read tables too large to Scan from an Export to S3 (needs PITR).
  DynamoDBExportKmsKeyArn:
    Type: String
    Default: ""
    Description: Optional KMS key for DynamoDB exports (else SSE-S3).
  DataApiTargets:
    Type: String
    Default: ""
    Description: RDS_DATA_API - opt-in JSON list of Aurora clusters to read with read-only SQL.
  DataApiClusterArns:
    Type: CommaDelimitedList
    Default: ""
    Description: The cluster ARNs named in DataApiTargets (for IAM).
  DataApiSecretArns:
    Type: CommaDelimitedList
    Default: ""
    Description: The Secrets Manager secret ARNs named in DataApiTargets (read-only database users).
  RedshiftRead:
    Type: String
    AllowedValues: ["off", iam, db-user]
    Default: "off"
    Description: >-
      REDSHIFT_READ - off (discover and report only), iam (the scanner's IAM
      identity: Redshift maps it to the database user IAMR:<role>, created on
      first use with PUBLIC privileges only; grant it SELECT), or db-user
      (temporary credentials for RedshiftDbUser, an existing read-only user, on
      provisioned clusters; Serverless uses iam). No password is stored.
  RedshiftDbUser:
    Type: String
    Default: ""
    AllowedPattern: "^([A-Za-z_][A-Za-z0-9_$]{0,126})?$"
    Description: REDSHIFT_DB_USER - the existing read-only database user, for RedshiftRead db-user.
  OpenSearchServerlessRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      OPENSEARCH_SERVERLESS_READ - read Serverless collections. IAM's
      aoss:APIAccessAll cannot be narrowed to reads: give the scanner's role
      aoss:ReadDocument (and nothing more) in each collection's data access
      policy. Managed domains are read with es:ESHttpGet only, always.
  EbsDirectRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      EBS_DIRECT_READ - sample each volume's latest snapshot with the EBS
      direct APIs (ListSnapshotBlocks, GetSnapshotBlock): no volume is created
      or attached. Off: volumes and snapshots are discovered and reported.
  SqsDlqRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      SQS_DLQ_READ - receive from dead-letter queues with VisibilityTimeout=0,
      never deleting. A receive raises each message's receive count, so a DLQ
      with its own redrive policy is never read. Live queues are never read.
  SsmDecrypt:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      SSM_DECRYPT - read SecureString parameters, decrypted through SSM
      (kms:Decrypt with kms:ViaService ssm.<region>). Off: they are counted,
      not read.
  SecretsRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      SECRETS_READ - read each secret's value for sensitive data (reported as
      counts, never the value). Off: secrets are listed and reported.
  MskRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      MSK_READ - sample MSK topics with IAM authentication: partitions assigned
      by hand and read from the earliest offset under a throwaway group id,
      never committed (AlterGroup is denied). Needs network reach to the
      brokers (public IAM access, or the function in the VPC); unreachable
      clusters are reported vpc_only.
  MqRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      MQ_READ - browse (never consume) the ActiveMQ queues named in MqBrokers,
      with a read-only broker user whose name and password are in a secret.
      The user is checked first; one that can write is refused.
  MqBrokers:
    Type: String
    Default: ""
    Description: >-
      MQ_BROKERS - a JSON list of {"broker", "secretArn", "queues"} for MqRead.
  MqSecretArns:
    Type: CommaDelimitedList
    Default: ""
    Description: The Secrets Manager secret ARNs named in MqBrokers (read-only broker users).
  EcrRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      ECR_READ - sample files from each repository's latest image's top
      layers (BatchGetImage, GetDownloadUrlForLayer; a layer is downloaded,
      so this is opt-in for its size). Off: repositories are reported.
  SageMakerRead:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      SAGEMAKER_READ - read each feature group's offline store in S3 (with the
      S3 statements). Online-only groups and notebook instances are reported
      no_read_path.
  NeptuneAnalyticsExportKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      The customer's KMS key for Neptune Analytics exports. Setting it turns on
      reading graphs by export (to the results bucket's exports/neptune-graph/,
      deleted once read) and creates the export role.
  EventBridgeReplay:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      EVENTBRIDGE_REPLAY - read EventBridge archives by replaying their last
      day to a rule of the scanner's own, on the archive's bus, that sends only
      the scanner's replays to the scanner's own queue (FilterArns: no other
      rule sees them). Creates that queue. Off: archives are reported.
  ScanMode:
    Type: String
    AllowedValues: [scanner, vendor, both]
    Default: scanner
    Description: >-
      SCAN_MODE - scanner (this scanner reads the stores), vendor (Amazon
      Macie's own findings are imported, S3 only, and this scanner reads
      nothing), or both (read and import; findings at the same place and class
      are linked). vendor and both allow the three Macie reads; the
      occurrence samples Macie can reveal are denied either way.
  FindingsEventBusArn:
    Type: String
    Default: ""
    Description: >-
      The central sink: a consumer-owned EventBridge bus whose policy allows
      events:PutEvents from the organization. Empty: findings stay in the
      results bucket.
  ScheduleExpression:
    Type: String
    Default: rate(1 day)
  MemorySize:
    Type: Number
    Default: 3008
    MinValue: 1024
    MaxValue: 10240
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  RunHistoryDays:
    Type: Number
    Default: 90
    Description: Days to keep findings/runs/<runId>.json documents.

Conditions:
  UseImage: !Not [!Equals [!Ref ImageUri, ""]]
  HasBus: !Not [!Equals [!Ref FindingsEventBusArn, ""]]
  KmsDecrypt: !Equals [!Ref AllowKmsDecrypt, "true"]
  RdsExport: !Not [!Equals [!Ref RdsExportKmsKeyArn, ""]]
  DynamoDBExport: !Equals [!Ref EnableDynamoDBExport, "true"]
  DynamoDBExportKey: !And
    - !Condition DynamoDBExport
    - !Not [!Equals [!Ref DynamoDBExportKmsKeyArn, ""]]
  DataApi: !Not [!Equals [!Ref DataApiTargets, ""]]
  RedshiftReads: !Not [!Equals [!Ref RedshiftRead, "off"]]
  RedshiftIam: !Equals [!Ref RedshiftRead, iam]
  RedshiftDbUserMode: !Equals [!Ref RedshiftRead, db-user]
  OpenSearchServerless: !Equals [!Ref OpenSearchServerlessRead, "true"]
  ConfigInSsm: !Equals [!Select [0, !Split [":", !Sub "${ConfigLocation}:"]], ssm]
  EbsRead: !Equals [!Ref EbsDirectRead, "true"]
  SqsDlq: !Equals [!Ref SqsDlqRead, "true"]
  SsmSecureStrings: !Equals [!Ref SsmDecrypt, "true"]
  SecretsValues: !Equals [!Ref SecretsRead, "true"]
  MacieImport: !Not [!Equals [!Ref ScanMode, scanner]]
  MskReads: !Equals [!Ref MskRead, "true"]
  EcrReads: !Equals [!Ref EcrRead, "true"]
  NeptuneGraphExport: !Not [!Equals [!Ref NeptuneAnalyticsExportKmsKeyArn, ""]]
  EventBridgeReplays: !Equals [!Ref EventBridgeReplay, "true"]
  MqReads: !And
    - !Equals [!Ref MqRead, "true"]
    - !Not [!Equals [!Join [",", !Ref MqSecretArns], ""]]

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sds-results-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # The scanner deletes each export once read; this is the backstop.
          - Id: exports-backstop
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 14
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - Id: run-history
            Status: Enabled
            Prefix: findings/runs/
            ExpirationInDays: !Ref RunHistoryDays

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub ${ResultsBucket.Arn}/*
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sensitive-data-scanner
      RetentionInDays: !Ref LogRetentionInDays

  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: sensitive-data-scanner - read-only discovery and reads; writes to its own results bucket only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: scanner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # --- its own results bucket: findings/, state/, exports/
              - Sid: OwnResultsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub ${ResultsBucket.Arn}/*
              # ListBucket also makes S3 answer a missing object (the first run's
              # state file) with 404, not 403. The scanner copes without it (#24).
              - Sid: OwnResultsBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResultsBucket.Arn
              # --- its configuration document in SSM, when ConfigLocation names one
              - !If
                - ConfigInSsm
                - Sid: ReadOwnConfigParameter
                  Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sensitive-data-scanner/*
                - !Ref AWS::NoValue
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}
              # --- S3: discover the buckets (and their default encryption), read the objects;
              # a large bucket's own inventory configuration is read, never written (#67)
              - Sid: DiscoverS3
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketTagging
                  - s3:GetEncryptionConfiguration
                  - s3:GetInventoryConfiguration
                Resource: "*"
              - Sid: ReadS3
                Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::*
              - Sid: ReadS3Objects
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: arn:aws:s3:::*/*
              # --- CloudWatch Logs
              - Sid: ReadLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:FilterLogEvents
                  - logs:ListTagsForResource
                Resource: "*"
              # --- DynamoDB
              - Sid: ReadDynamoDB
                Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:ListTagsOfResource
                Resource: "*"
              # --- Glue Data Catalog (Lake Formation: nothing; see the Deny below)
              - Sid: ReadGlueCatalog
                Effect: Allow
                Action: [glue:GetDatabases, glue:GetTables, glue:GetTags]
                Resource: "*"
              # --- RDS and Aurora: describe, to discover and report every store
              - Sid: DescribeRds
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusterSnapshots
                  - rds:DescribeDBSnapshots
                  - rds:DescribeExportTasks
                Resource: "*"
              # --- Redshift and Redshift Serverless: describe, to discover and report
              - Sid: DescribeRedshift
                Effect: Allow
                Action:
                  - redshift:DescribeClusters
                  - redshift-serverless:ListWorkgroups
                  - redshift-serverless:ListNamespaces
                  - redshift-serverless:ListTagsForResource
                Resource: "*"
              # --- OpenSearch: discover domains and collections; read with GET only
              - Sid: DescribeOpenSearch
                Effect: Allow
                Action:
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - es:ListTags
                  - aoss:ListCollections
                  - aoss:BatchGetCollection
                  - aoss:ListTagsForResource
                Resource: "*"
              - Sid: ReadOpenSearchDomains
                Effect: Allow
                Action: es:ESHttpGet
                Resource: !Sub arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/*/*
              - !If
                - OpenSearchServerless
                - Sid: ReadServerlessCollections
                  Effect: Allow
                  Action: aoss:APIAccessAll
                  Resource: !Sub arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
                - !Ref AWS::NoValue
              # --- Snapshots, backups and file systems: discover and report
              - Sid: DescribeSnapshotsBackupsAndFileSystems
                Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - backup:ListBackupVaults
                  - backup:ListRecoveryPointsByBackupVault
                  - backup:ListTags
                  - elasticfilesystem:DescribeFileSystems
                  - fsx:DescribeFileSystems
                  - docdb-elastic:ListClusters
                  - docdb-elastic:ListTagsForResource
                Resource: "*"
              - !If
                - EbsRead
                - Sid: ReadEbsSnapshotBlocks
                  Effect: Allow
                  Action: [ebs:ListSnapshotBlocks, ebs:GetSnapshotBlock]
                  Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*
                - !Ref AWS::NoValue
              - !If
                - EbsRead
                - Sid: DecryptSnapshotsThroughEbs
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService:
                        - !Sub ebs.${AWS::Region}.amazonaws.com
                        - !Sub ec2.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Streams and queues: Kinesis sampled (never checkpointed), Firehose
              # destinations read as S3, SQS listed (dead-letter queues opt-in below)
              - Sid: ReadStreamsAndListQueues
                Effect: Allow
                Action:
                  - kinesis:ListStreams
                  - kinesis:DescribeStreamSummary
                  - kinesis:ListShards
                  - kinesis:ListTagsForStream
                  - kinesis:GetShardIterator
                  - kinesis:GetRecords
                  - firehose:ListDeliveryStreams
                  - firehose:DescribeDeliveryStream
                  - firehose:ListTagsForDeliveryStream
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - sqs:ListQueueTags
                Resource: "*"
              - !If
                - SqsDlq
                - Sid: ReceiveFromDeadLetterQueues
                  Effect: Allow
                  Action: sqs:ReceiveMessage
                  Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:*
                - !Ref AWS::NoValue
              - !If
                - SqsDlq
                - Sid: DecryptQueuesThroughSqs
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub sqs.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Parameter Store and Secrets Manager
              - Sid: ListConfigStores
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                  - ssm:ListTagsForResource
                  - secretsmanager:ListSecrets
                Resource: "*"
              - Sid: ReadParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*
              - !If
                - SsmSecureStrings
                - Sid: DecryptParametersThroughSsm
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              - !If
                - SecretsValues
                - Sid: ReadSecretValues
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*
                - !Ref AWS::NoValue
              - !If
                - SecretsValues
                - Sid: DecryptSecretsThroughSecretsManager
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              # --- Caches (reported), Timestream and Keyspaces (sampled read-only queries)
              - Sid: DescribeCachesAndTimeSeries
                Effect: Allow
                Action:
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeServerlessCaches
                  - elasticache:DescribeSnapshots
                  - elasticache:DescribeServerlessCacheSnapshots
                  - memorydb:DescribeClusters
                  - memorydb:DescribeSnapshots
                  - timestream:DescribeEndpoints
                  - timestream:ListDatabases
                  - timestream:ListTables
                  - timestream:ListTagsForResource
                  - timestream-influxdb:ListDbInstances
                Resource: "*"
              - Sid: SelectTimestreamTables
                Effect: Allow
                Action: timestream:Select
                Resource: !Sub arn:${AWS::Partition}:timestream:${AWS::Region}:${AWS::AccountId}:database/*/table/*
              # Keyspaces: listing reads the system keyspaces, and a sample reads a table;
              # both are cassandra:Select, the only Keyspaces permission.
              - Sid: SelectKeyspaces
                Effect: Allow
                Action: cassandra:Select
                Resource: !Sub arn:${AWS::Partition}:cassandra:${AWS::Region}:${AWS::AccountId}:/keyspace/*
              # --- Group 7, read by default (#35): Step Functions history, Lambda
              # environment variables (counts only), X-Ray traces, CodeCommit files
              - Sid: ReadWorkflowsFunctionsTracesAndCode
                Effect: Allow
                Action:
                  - states:ListStateMachines
                  - states:DescribeStateMachine
                  - states:ListTagsForResource
                  - states:ListExecutions
                  - states:GetExecutionHistory
                  - lambda:ListFunctions
                  - lambda:ListTags
                  - lambda:GetFunctionConfiguration
                  - xray:GetEncryptionConfig
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - codecommit:ListRepositories
                  - codecommit:GetRepository
                  - codecommit:ListTagsForResource
                  - codecommit:GetBranch
                  - codecommit:GetFolder
                  - codecommit:GetFile
                Resource: "*"
              # --- S3 directory buckets: listed, and read through S3 Express sessions
              # that can only be read-only (a session is the only way in)
              - Sid: ListDirectoryBuckets
                Effect: Allow
                Action: s3express:ListAllMyDirectoryBuckets
                Resource: "*"
              - Sid: ReadOnlyExpressSessions
                Effect: Allow
                Action: s3express:CreateSession
                Resource: !Sub arn:${AWS::Partition}:s3express:${AWS::Region}:${AWS::AccountId}:bucket/*
                Condition:
                  StringEquals: { "s3express:SessionMode": ReadOnly }
              # --- Brokers: MSK and Amazon MQ, discovered and reported; reads opt-in below
              - Sid: DescribeBrokers
                Effect: Allow
                Action: [kafka:ListClustersV2, mq:ListBrokers, mq:DescribeBroker]
                Resource: "*"
              - !If
                - MskReads
                - Sid: MskBootstrapBrokers
                  Effect: Allow
                  Action: kafka:GetBootstrapBrokers
                  Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/*/*
                - !Ref AWS::NoValue
              - !If
                - MskReads
                - Sid: ConnectToMskClusters
                  Effect: Allow
                  Action: [kafka-cluster:Connect, kafka-cluster:DescribeCluster]
                  Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/*/*
                - !Ref AWS::NoValue
              - !If
                - MskReads
                - Sid: ReadMskTopics
                  Effect: Allow
                  Action: [kafka-cluster:DescribeTopic, kafka-cluster:ReadData]
                  Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/*/*/*
                - !Ref AWS::NoValue
              # Its own throwaway groups only, and only to describe them (the consumer
              # asks for their committed offsets; there are none, and AlterGroup is denied).
              - !If
                - MskReads
                - Sid: DescribeOwnThrowawayGroups
                  Effect: Allow
                  Action: kafka-cluster:DescribeGroup
                  Resource: !Sub arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/*/*/sensitive-data-scanner-*
                - !Ref AWS::NoValue
              - !If
                - MqReads
                - Sid: CheckMqUsers
                  Effect: Allow
                  Action: [mq:DescribeUser, mq:DescribeConfigurationRevision]
                  Resource:
                    - !Sub arn:${AWS::Partition}:mq:${AWS::Region}:${AWS::AccountId}:broker:*
                    - !Sub arn:${AWS::Partition}:mq:${AWS::Region}:${AWS::AccountId}:configuration:*
                - !Ref AWS::NoValue
              - !If
                - MqReads
                - Sid: ReadMqUserSecrets
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref MqSecretArns
                - !Ref AWS::NoValue
              # --- Images, ML, graphs and archives: discovered and reported (#35)
              - Sid: DescribeImagesMlGraphsAndArchives
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:ListTagsForResource
                  - sagemaker:ListFeatureGroups
                  - sagemaker:DescribeFeatureGroup
                  - sagemaker:ListNotebookInstances
                  - sagemaker:ListTags
                  - neptune-graph:ListGraphs
                  - neptune-graph:ListTagsForResource
                  - events:ListArchives
                  - events:DescribeArchive
                  - glacier:ListVaults
                  - glacier:ListTagsForVault
                Resource: "*"
              - !If
                - EcrReads
                - Sid: ReadEcrImageLayers
                  Effect: Allow
                  Action: [ecr:DescribeImages, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                  Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*
                - !Ref AWS::NoValue
              - !If
                - NeptuneGraphExport
                - Sid: StartGraphExports
                  Effect: Allow
                  Action: neptune-graph:StartExportTask
                  Resource: !Sub arn:${AWS::Partition}:neptune-graph:${AWS::Region}:${AWS::AccountId}:graph/*
                - !Ref AWS::NoValue
              - !If
                - NeptuneGraphExport
                - Sid: WatchGraphExports
                  Effect: Allow
                  Action: neptune-graph:GetExportTask
                  Resource: !Sub arn:${AWS::Partition}:neptune-graph:${AWS::Region}:${AWS::AccountId}:export-task/*
                - !Ref AWS::NoValue
              - !If
                - NeptuneGraphExport
                - Sid: PassTheGraphExportRoleOnly
                  Effect: Allow
                  Action: iam:PassRole
                  Resource: !GetAtt NeptuneGraphExportRole.Arn
                  Condition:
                    StringEquals: { iam:PassedToService: neptune-graph.amazonaws.com }
                - !Ref AWS::NoValue
              - !If
                - NeptuneGraphExport
                - Sid: ReadTheGraphExport
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref NeptuneAnalyticsExportKmsKeyArn
                  Condition:
                    StringEquals: { kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com" }
                - !Ref AWS::NoValue
              # An archive is read only by a replay: to a rule of the scanner's own on the
              # archive's bus, which sends only its replays to its own queue.
              - !If
                - EventBridgeReplays
                - Sid: OwnReplayRules
                  Effect: Allow
                  Action: [events:PutRule, events:PutTargets, events:RemoveTargets, events:DeleteRule]
                  Resource:
                    - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/sensitive-data-scanner-replay-*
                    - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*/sensitive-data-scanner-replay-*
                - !Ref AWS::NoValue
              - !If
                - EventBridgeReplays
                - Sid: StartOwnReplays
                  Effect: Allow
                  Action: [events:StartReplay, events:DescribeReplay]
                  Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:replay/sds-*
                - !Ref AWS::NoValue
              - !If
                - EventBridgeReplays
                - Sid: OwnReplayQueue
                  Effect: Allow
                  Action: [sqs:ReceiveMessage, sqs:DeleteMessage]
                  Resource: !GetAtt ReplayQueue.Arn
                - !Ref AWS::NoValue
              # --- Which KMS keys are AWS managed (alias/aws/*), to tell each store's
              # at-rest key apart (#35). Metadata only: no key is described or used.
              - Sid: ListKmsAliases
                Effect: Allow
                Action: kms:ListAliases
                Resource: "*"
              # --- Push findings to the central sink
              - !If
                - HasBus
                - Sid: PushFindings
                  Effect: Allow
                  Action: events:PutEvents
                  Resource: !Ref FindingsEventBusArn
                - !Ref AWS::NoValue
              # --- Customer managed keys, only through S3 and DynamoDB
              - !If
                - KmsDecrypt
                - Sid: DecryptThroughS3AndDynamoDB
                  Effect: Allow
                  Action: kms:Decrypt
                  Resource: "*"
                  Condition:
                    StringEquals:
                      kms:ViaService:
                        - !Sub s3.${AWS::Region}.amazonaws.com
                        - !Sub dynamodb.${AWS::Region}.amazonaws.com
                        - !Sub kinesis.${AWS::Region}.amazonaws.com
                        - !Sub states.${AWS::Region}.amazonaws.com
                        - !Sub lambda.${AWS::Region}.amazonaws.com
                        - !Sub xray.${AWS::Region}.amazonaws.com
                        - !Sub codecommit.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
              - !If
                - MacieImport
                - Sid: ReadMacieFindings
                  Effect: Allow
                  Action:
                    - macie2:GetMacieSession
                    - macie2:ListFindings
                    - macie2:GetFindings
                  Resource: "*"
                - !Ref AWS::NoValue
              # --- Defense in depth: never write anywhere else, never escalate
              - Sid: NeverRevealOrChangeMacie
                Effect: Deny
                Action:
                  - macie2:GetSensitiveDataOccurrences*
                  - macie2:GetRevealConfiguration
                  - macie2:UpdateRevealConfiguration
                  - macie2:Create*
                  - macie2:Update*
                  - macie2:Delete*
                  - macie2:Put*
                  - macie2:Enable*
                  - macie2:Disable*
                  - macie2:Accept*
                  - macie2:Decline*
                  - macie2:Tag*
                  - macie2:Untag*
                Resource: "*"
              - Sid: NoWritesOutsideOwnBucket
                Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:PutObjectTagging
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:RestoreObject
                  - s3:ReplicateObject
                  - s3:PutBucket*
                  - s3:DeleteBucket*
                NotResource:
                  - !GetAtt ResultsBucket.Arn
                  - !Sub ${ResultsBucket.Arn}/*
              - Sid: NoDataStoreWrites
                Effect: Deny
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PartiQLDelete
