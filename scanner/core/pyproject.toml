[project]
name = "sensitive-data-scanner-core"
version = "0.4.1"
description = "The cloud-neutral core of the sensitive data scanner: the spec, detection, findings, budgets and sampling, the coverage summary and the findings push. Findings only, never values."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
# No cloud SDK: a platform's package (AWS: sensitive-data-scanner) brings its own.
dependencies = [
    "presidio-analyzer>=2.2.364,<2.3",
    # PDF text (#65): pure Python, no dependencies of its own.
    "pypdf>=6.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_core"]

# The spec travels inside the package; in a checkout it is read from ../../spec.
[tool.hatch.build.targets.wheel.force-include]
"../../spec/classes.yaml" = "sensitive_data_core/spec_data/classes.yaml"
"../../spec/normalize.yaml" = "sensitive_data_core/spec_data/normalize.yaml"
"../../LICENSE" = "sensitive_data_core/LICENSE"
"../../NOTICE" = "sensitive_data_core/NOTICE"
"../../third_party/presidio/LICENSE" = "sensitive_data_core/third_party/presidio/LICENSE"
"../../schema/findings.schema.json" = "sensitive_data_core/schema/findings.schema.json"
