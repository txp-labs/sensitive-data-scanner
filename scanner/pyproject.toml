[project]
name = "sensitive-data-scanner"
version = "0.0.0"
description = "Find card numbers, US SSNs and other sensitive data in your own cloud storage and logs, reporting findings only, never values."
readme = "README.md"
license = "Apache-2.0"
license-files = ["../LICENSE", "../NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
  "types-jsonschema>=4.26.0.20260518",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_scanner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL", "T20"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["sensitive_data_scanner", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
