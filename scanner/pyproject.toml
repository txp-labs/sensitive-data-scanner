[project]
name = "sensitive-data-scanner"
version = "0.2.0"
description = "Find card numbers, US SSNs and other sensitive data in your own cloud storage and logs, reporting findings only, never values."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
dependencies = [
    "boto3>=1.40",
    "presidio-analyzer>=2.2.364,<2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "boto3-stubs[dynamodb,events,glue,logs,rds,rds-data,s3]>=1.43.103",
  "fastavro>=1.12",
  "jsonschema>=4.26.0",
  "moto[events,glue,logs,s3]>=5.2.3",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
  "types-jsonschema>=4.26.0.20260518",
  "types-pyyaml>=6.0.12.20260906",
]
lambda = [
    "awslambdaric>=4.1.0",
]
# Columnar and data-lake formats (Parquet, ORC, Avro codecs, zstd). In the
# container image, not the Lambda zip: with pyarrow the zip would pass
# Lambda's 250 MB unzipped limit (docs/ARCHITECTURE.md).
columnar = [
    "pyarrow>=21",
]

[tool.uv]
default-groups = ["dev", "columnar"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_scanner"]

# The spec travels inside the package; in a checkout it is read from ../spec.
[tool.hatch.build.targets.wheel.force-include]
"../spec/classes.yaml" = "sensitive_data_scanner/spec_data/classes.yaml"
"../spec/normalize.yaml" = "sensitive_data_scanner/spec_data/normalize.yaml"
"../LICENSE" = "sensitive_data_scanner/LICENSE"
"../NOTICE" = "sensitive_data_scanner/NOTICE"
"../third_party/presidio/LICENSE" = "sensitive_data_scanner/third_party/presidio/LICENSE"
"../schema/findings.schema.json" = "sensitive_data_scanner/schema/findings.schema.json"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL", "T20"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["sensitive_data_scanner", "conftest", "synthetic", "aws_fixtures"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# pyarrow ships no type information.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "fastavro", "fastavro.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
