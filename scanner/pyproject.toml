[project]
name = "sensitive-data-scanner"
version = "0.3.0"
description = "Find card numbers, US SSNs and other sensitive data in your own cloud storage and logs, reporting findings only, never values."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
dependencies = [
    "sensitive-data-scanner-core",
    "boto3>=1.40",
    # Amazon Keyspaces over CQL, signed with the scanner's role (no password).
    "cassandra-driver>=3.29",
    "cassandra-sigv4>=4.0.2",
    "pyyaml>=6.0.3",
    # Amazon MSK, sampled with IAM authentication (its own AWS_MSK_IAM mechanism); opt-in.
    "kafka-python>=3.0",
]

[dependency-groups]
dev = [
  # The databases runner with every engine's driver, for its tests and types.
  "sensitive-data-scanner-db[all]",
  # The Azure scanner with every optional part, for its tests and types.
  "sensitive-data-scanner-azure[all]",
  # The Google Cloud scanner with every optional part, for its tests and types.
  "sensitive-data-scanner-gcp[all]",
  # The SaaS scanner with every optional part, for its tests and types.
  "sensitive-data-scanner-saas[all]",
  "boto3-stubs[dynamodb,events,glue,logs,rds,rds-data,s3]>=1.43.103",
  "cfn-lint>=1.40",
  "fastavro>=1.12",
  # Property-based fuzzing of the readers (tests/test_fuzz_readers.py, #77).
  "hypothesis>=6.140",
  "jsonschema>=4.26.0",
  "moto[events,glue,logs,s3]>=5.2.3",
  # Parses deploy/gcp's Terraform for its strict read-only test.
  "python-hcl2>=7.0",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
  # PostgreSQL and MySQL in containers for the databases runner (skipped without Docker).
  "testcontainers>=4.8",
  "types-jsonschema>=4.26.0.20260518",
  "types-pyyaml>=6.0.12.20260906",
]
lambda = [
    "awslambdaric>=4.1.0",
]
# Columnar and data-lake formats (Parquet, ORC, Avro codecs, zstd). In the
# container image, not the Lambda zip: with pyarrow the zip would pass
# Lambda's 250 MB unzipped limit (docs/ARCHITECTURE.md).
columnar = [
    "pyarrow>=21",
]

[tool.uv]
default-groups = ["dev", "columnar"]

# The cloud-neutral core is its own package (core/); this project is the AWS
# scanner built on it; db/ is the databases-anywhere runner, azure/ the Azure
# scanner, gcp/ the Google Cloud scanner and saas/ the SaaS scanner, all also built on it.
[tool.uv.workspace]
members = ["core", "db", "azure", "gcp", "saas"]

[tool.uv.sources]
sensitive-data-scanner-core = { workspace = true }
sensitive-data-scanner-db = { workspace = true }
sensitive-data-scanner-azure = { workspace = true }
sensitive-data-scanner-gcp = { workspace = true }
sensitive-data-scanner-saas = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_scanner"]

# The spec and the findings schema travel in the core package
# (sensitive_data_core/spec_data); the licenses in both.
[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "sensitive_data_scanner/LICENSE"
"../NOTICE" = "sensitive_data_scanner/NOTICE"
"../third_party/presidio/LICENSE" = "sensitive_data_scanner/third_party/presidio/LICENSE"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "core/src", "db/src", "azure/src", "gcp/src", "saas/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL", "T20"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["sensitive_data_scanner", "sensitive_data_core", "sensitive_data_db", "sensitive_data_azure", "sensitive_data_gcp", "sensitive_data_saas", "conftest", "synthetic", "aws_fixtures", "azure_fakes", "gcp_fakes", "saas_fakes", "gws_fakes", "slack_fakes", "atlassian_fakes", "office_fixtures", "bench_corpus", "bench_score"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "core/src", "db/src", "azure/src", "gcp/src", "saas/src", "tests"]

# pyarrow and the Cassandra driver ship no type information.
[[tool.mypy.overrides]]
module = [
  "pyarrow", "pyarrow.*", "fastavro", "fastavro.*",
  "cassandra", "cassandra.*", "cassandra_sigv4", "cassandra_sigv4.*",
  "kafka", "kafka.*",
  "pymysql", "pymysql.*", "pymssql", "pymssql.*", "snowflake", "snowflake.*",
  "databricks", "databricks.*", "testcontainers", "testcontainers.*", "docker", "docker.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
