[project]
name = "sensitive-data-scanner-saas"
version = "0.5.0"
description = "The SaaS scanner of the sensitive data scanner: a container the customer runs in its own environment, with read-only grants to its Microsoft 365, Google Workspace, Slack and Atlassian tenants, that samples their content and reports findings only, never values."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
# The vendors' APIs are called over HTTPS with `requests`; no vendor SDK. A client
# certificate's assertion is signed with `cryptography`.
dependencies = [
    "sensitive-data-scanner-core",
    "cryptography>=45",
    "requests>=2.32",
]

[project.optional-dependencies]
# Columnar formats in attachments and files (Parquet, ORC, zstd, Avro's codecs).
columnar = ["pyarrow>=21"]
# The state in S3, and a federated token from AWS (sts:GetWebIdentityToken).
aws = ["boto3>=1.43"]
all = ["sensitive-data-scanner-saas[columnar,aws]"]

[project.scripts]
sensitive-data-scanner-saas = "sensitive_data_saas.__main__:main"

[tool.uv.sources]
sensitive-data-scanner-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_saas"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "sensitive_data_saas/LICENSE"
"../../NOTICE" = "sensitive_data_saas/NOTICE"
