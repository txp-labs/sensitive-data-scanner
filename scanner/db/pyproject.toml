[project]
name = "sensitive-data-scanner-db"
version = "0.4.0"
description = "The databases-anywhere runner of the sensitive data scanner: a container that samples PostgreSQL, MySQL/MariaDB, SQL Server, Oracle, MongoDB, Snowflake and Databricks SQL with a read-only user, and reports findings only, never values."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
dependencies = [
    "sensitive-data-scanner-core",
]

# One extra per engine: install only the drivers you read with. `all` is what
# the container image carries by default (docs/DATABASES.md, Image size).
[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
sqlserver = ["pymssql>=2.3"]
oracle = ["oracledb>=2.5"]
mongodb = ["pymongo>=4.10"]
snowflake = ["snowflake-connector-python>=3.12"]
databricks = ["databricks-sql-connector>=4.0"]
# Findings to an EventBridge bus (FINDINGS_EVENT_BUS_ARN).
aws = ["boto3>=1.40"]
all = [
    "sensitive-data-scanner-db[postgresql,mysql,sqlserver,oracle,mongodb,snowflake,databricks,aws]",
]

[project.scripts]
sensitive-data-scanner-db = "sensitive_data_db.__main__:main"

[tool.uv.sources]
sensitive-data-scanner-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_db"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "sensitive_data_db/LICENSE"
"../../NOTICE" = "sensitive_data_db/NOTICE"
