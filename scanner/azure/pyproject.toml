[project]
name = "sensitive-data-scanner-azure"
version = "0.5.0"
description = "The Azure scanner of the sensitive data scanner: a Container Apps job with a managed identity that discovers and samples a management group's data stores read-only, and reports findings only, never values."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "txp-labs, LLC" }]
# Azure's SDKs live here, never in the core. The identity is the job's managed
# identity through DefaultAzureCredential: no secret is configured.
dependencies = [
    "sensitive-data-scanner-core",
    # The databases runner's SQL sessions and user checks, for Azure's databases.
    "sensitive-data-scanner-db",
    "azure-core>=1.35",
    "azure-identity>=1.25",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-storage-blob>=12.26",
    # Table and Queue Storage, peeked and sampled with their data-reader roles.
    "azure-data-tables>=12.7",
    "azure-storage-queue>=12.13",
    # Azure Files shares (opt-in), read over REST with Storage File Data Privileged Reader.
    "azure-storage-file-share>=12.20",
    # Cosmos DB for NoSQL, with the Cosmos DB Built-in Data Reader role.
    "azure-cosmos>=4.9",
    # Log Analytics workspaces (Azure Monitor logs), sampled KQL with Log Analytics Reader.
    "azure-monitor-query>=2.0",
    # Key Vault secrets (off by default), counted with Key Vault Secrets User.
    "azure-keyvault-secrets>=4.9",
]

[project.optional-dependencies]
# Columnar and data-lake formats (Parquet, ORC, zstd, Avro's snappy and zstandard).
columnar = ["pyarrow>=21"]
# Findings to an Event Grid topic (FINDINGS_EVENT_GRID_ENDPOINT).
eventgrid = ["azure-eventgrid>=4.20"]
# Azure SQL, SQL Managed Instance and Synapse SQL pools, with an Entra token
# (mssql-python brings its own ODBC driver; pymssql cannot take a token).
sql = ["mssql-python>=1.15"]
# Azure Database for PostgreSQL and MySQL flexible servers, with an Entra token.
postgresql = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
# Azure Cosmos DB for MongoDB (vCore), with an Entra token (MONGODB-OIDC).
mongodb = ["pymongo>=4.10"]
all = ["sensitive-data-scanner-azure[columnar,eventgrid,sql,postgresql,mysql,mongodb]"]

[project.scripts]
sensitive-data-scanner-azure = "sensitive_data_azure.__main__:main"

[tool.uv.sources]
sensitive-data-scanner-core = { workspace = true }
sensitive-data-scanner-db = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensitive_data_azure"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "sensitive_data_azure/LICENSE"
"../../NOTICE" = "sensitive_data_azure/NOTICE"
