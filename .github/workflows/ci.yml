# Continuous integration: the Python runner and the TypeScript spec package.
# Every `uses:` is pinned to a full commit SHA (txp-labs org policy).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy

      - name: Tests
        env:
          # The parity test runs the TypeScript package with Node; in CI a
          # missing Node is a failure, not a skip.
          SDS_REQUIRE_PARITY: "1"
        run: uv run pytest

  node:
    name: Node (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/spec-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Compiled spec is up to date
        run: npm run gen:spec:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (every vector)
        run: npm test

      - name: Build
        run: npm run build

      - name: No runtime dependencies
        run: |
          node -e 'const p=require("./package.json"); const d=Object.keys(p.dependencies||{}); if(d.length){console.error("runtime dependencies:",d); process.exit(1)}'

  spec-ts-dist:
    # dist/ is committed so the package can be consumed by git commit (package
    # managers do not build git dependencies). It must be exactly what a fresh
    # build of src/ produces.
    name: spec-ts dist matches a fresh build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/spec-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Rebuild dist from scratch
        run: |
          rm -rf dist
          npm run build

      - name: Committed dist is up to date
        run: |
          set -euo pipefail
          changes=$(git status --porcelain --untracked-files=all -- dist)
          if [ -n "${changes}" ]; then
            echo "${changes}"
            git --no-pager diff -- dist
            echo "::error::packages/spec-ts/dist differs from a fresh build: run 'npm run build' in packages/spec-ts and commit dist/."
            exit 1
          fi

  package:
    name: Package (Lambda image and zip)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build the Lambda zip
        run: scripts/build-lambda-zip.sh ci out

      - name: The zip fits Lambda's 250 MB unzipped limit
        run: |
          set -euo pipefail
          size=$(unzip -l out/*.zip | tail -1 | awk '{print $1}')
          echo "unzipped bytes: ${size}"
          test "${size}" -lt 262144000

      - name: Build the container image
        run: docker build -t sensitive-data-scanner:ci .

      - name: Smoke test the image (detection with no NLP model, no network)
        run: |
          set -euo pipefail
          docker image ls sensitive-data-scanner:ci --format 'image size: {{.Size}}'
          docker run --rm --network none --entrypoint python sensitive-data-scanner:ci -c '
          import datetime as dt
          from sensitive_data_scanner.detect.analyzer import Detector
          from sensitive_data_scanner.engine.conversation import Turn
          d = Detector(now=dt.date(2026, 9, 29))
          a = d.analyze_conversation([
              Turn("bot", "Please enter or say your nine digit Social Security number."),
              Turn("customer", "123456789#", "dtmf"),
          ])
          assert [(x.cls, x.via, x.confidence) for x in a.detections] == [("us_ssn", "prompt", "high")]
          import sensitive_data_scanner.handler, awslambdaric
          print("ok")
          '
