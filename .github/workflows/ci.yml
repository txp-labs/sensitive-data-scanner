# Continuous integration: the Python runner and the TypeScript spec package.
# Every `uses:` is pinned to a full commit SHA (txp-labs org policy).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy

      - name: Templates (cfn-lint)
        run: uv run cfn-lint ../deploy/*.yaml

      - name: Tests
        env:
          # The parity test runs the TypeScript package with Node, and the
          # databases runner's PostgreSQL and MySQL tests run in Docker
          # (testcontainers); in CI a missing Node or Docker is a failure.
          SDS_REQUIRE_PARITY: "1"
          SDS_REQUIRE_DOCKER: "1"
        run: uv run pytest

  node:
    name: Node (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/spec-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Compiled spec is up to date
        run: npm run gen:spec:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (every vector)
        run: npm test

      - name: Build
        run: npm run build

      - name: No runtime dependencies
        run: |
          node -e 'const p=require("./package.json"); const d=Object.keys(p.dependencies||{}); if(d.length){console.error("runtime dependencies:",d); process.exit(1)}'

  spec-ts-dist:
    # dist/ is committed so the package can be consumed by git commit (package
    # managers do not build git dependencies). It must be exactly what a fresh
    # build of src/ produces.
    name: spec-ts dist matches a fresh build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/spec-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Rebuild dist from scratch
        run: |
          rm -rf dist
          npm run build

      - name: Committed dist is up to date
        run: |
          set -euo pipefail
          changes=$(git status --porcelain --untracked-files=all -- dist)
          if [ -n "${changes}" ]; then
            echo "${changes}"
            git --no-pager diff -- dist
            echo "::error::packages/spec-ts/dist differs from a fresh build: run 'npm run build' in packages/spec-ts and commit dist/."
            exit 1
          fi

  package:
    name: Package (Lambda image and zip)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build the Lambda zip
        run: scripts/build-lambda-zip.sh ci out

      - name: The zip fits Lambda's 250 MB unzipped limit, without pyarrow
        run: |
          set -euo pipefail
          size=$(unzip -l out/*.zip | tail -1 | awk '{print $1}')
          echo "unzipped bytes: ${size}"
          test "${size}" -lt 262144000
          # pyarrow is the container image's: in the zip it would pass the limit.
          if unzip -l out/*.zip | grep -q ' pyarrow/'; then echo "pyarrow in the zip"; exit 1; fi

      - name: Build the container image
        run: docker build -t sensitive-data-scanner:ci .

      - name: Smoke test the image (detection with no NLP model, no network)
        run: |
          set -euo pipefail
          docker image ls sensitive-data-scanner:ci --format 'image size: {{.Size}}'
          docker run --rm --network none --entrypoint python sensitive-data-scanner:ci -c '
          import datetime as dt
          from sensitive_data_core.detect.analyzer import Detector
          from sensitive_data_core.engine.conversation import Turn
          d = Detector(now=dt.date(2026, 9, 29))
          a = d.analyze_conversation([
              Turn("bot", "Please enter or say your nine digit Social Security number."),
              Turn("customer", "123456789#", "dtmf"),
          ])
          assert [(x.cls, x.via, x.confidence) for x in a.detections] == [("us_ssn", "prompt", "high")]
          import sensitive_data_scanner.handler, awslambdaric
          # The image reads the columnar formats: Parquet, ORC and zstd through pyarrow.
          import io
          import pyarrow as pa, pyarrow.parquet as pq, pyarrow.orc as orc
          from sensitive_data_core.scan.columnar import pyarrow_available, scan_table
          assert pyarrow_available()
          t = pa.table({"card_number": ["4111111111111111"], "note": ["x"]})
          for kind, write in (("parquet", pq.write_table), ("orc", orc.write_table)):
              buf = io.BytesIO(); write(t, buf); buf.seek(0)
              r = scan_table(kind, buf, d, 100)
              assert r.rows == 1, kind
          print("ok")
          '

      - name: Build the databases runner image (every engine, and PostgreSQL and MySQL only)
        run: |
          set -euo pipefail
          docker build --target db -t sensitive-data-scanner-db:ci .
          docker build --target db --build-arg DB_EXTRAS="postgresql mysql" -t sensitive-data-scanner-db:slim .
          docker image ls sensitive-data-scanner-db --format 'db image {{.Tag}}: {{.Size}}'

      - name: Smoke test the databases runner image (no network)
        run: |
          set -euo pipefail
          # A wrong setting is reported by its code, and nothing else is printed.
          out=$(docker run --rm --network none -e SCANNER_SITE=ci \
            -e DATABASE_URL_X='redis://u:made-up@h/0' -e FINDINGS_FILE=/tmp/f.json \
            sensitive-data-scanner-db:ci scan || true)
          echo "${out}"
          echo "${out}" | grep -q '"error":"unknown_scheme"'
          if echo "${out}" | grep -q made-up; then echo "the connection string was printed"; exit 1; fi
          # Every engine's driver imports in the full image; the slim one reports the rest as missing.
          docker run --rm --network none --entrypoint python sensitive-data-scanner-db:ci -c '
          from sensitive_data_db.engines import DRIVERS, load_driver
          missing = [e for e in DRIVERS if load_driver(e) is None]
          assert not missing, missing
          import boto3
          print("ok")
          '
          docker run --rm --network none --entrypoint python sensitive-data-scanner-db:slim -c '
          from sensitive_data_db.engines import DRIVERS, load_driver
          got = sorted(e for e in DRIVERS if load_driver(e) is not None)
          assert got == ["mysql", "postgresql"], got
          print("ok")
          '
          # A database that cannot be reached: the run completes and names the error.
          docker run --rm --network none -v "${RUNNER_TEMP}:/out" -u "$(id -u)" -e SCANNER_SITE=ci \
            -e DATABASE_URL_PG='postgresql://ro:made-up@db.invalid:5432/app' \
            -e DB_CONNECT_TIMEOUT_SECONDS=2 -e FINDINGS_FILE=/out/findings.json \
            sensitive-data-scanner-db:ci
          python3 -c '
          import json, os
          doc = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "findings.json")))
          s = doc["discovery"]["stores"][0]
          assert (doc["platform"], s["status"], s["reason"]) == ("database", "error", "error"), s
          assert "made-up" not in json.dumps(doc)
          print("ok")
          '

      - name: Build the Azure scanner image
        run: |
          set -euo pipefail
          docker build --target azure -t sensitive-data-scanner-azure:ci .
          docker image ls sensitive-data-scanner-azure:ci --format 'azure image size: {{.Size}}'

      - name: Smoke test the Azure scanner image (no network)
        run: |
          set -euo pipefail
          # A wrong setting is reported by its code, and nothing else is printed.
          out=$(docker run --rm --network none -e SCANNER_SITE=ci -e AZURE_MANAGEMENT_GROUP=mg-ci \
            -e FINDINGS_HTTPS_URL='http://collector.invalid/made-up-token' \
            sensitive-data-scanner-azure:ci scan || true)
          echo "${out}"
          echo "${out}" | grep -q '"error":"findings_url_not_https"'
          if echo "${out}" | grep -q made-up; then echo "the push URL was printed"; exit 1; fi
          # With no network there is no token: discovery names the listing error, exit 2.
          set +e
          out=$(docker run --rm --network none -e SCANNER_SITE=ci -e AZURE_MANAGEMENT_GROUP=mg-ci \
            -e FINDINGS_FILE=/tmp/f.json sensitive-data-scanner-azure:ci check)
          code=$?
          set -e
          echo "${out}"
          test "${code}" = 2
          echo "${out}" | grep -q '"event":"discovery.failed"'
          docker run --rm --network none --entrypoint python sensitive-data-scanner-azure:ci -c '
          import azure.identity, azure.storage.blob, azure.mgmt.resourcegraph, azure.eventgrid
          from sensitive_data_core.scan.columnar import pyarrow_available
          assert pyarrow_available()
          import sensitive_data_azure.runner
          print("ok")
          '
