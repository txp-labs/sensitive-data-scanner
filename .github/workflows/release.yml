          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-image-sbom
          path: sensitive-data-scanner-gcp-${{ needs.verify.outputs.version }}-image.spdx.json
          if-no-files-found: error
          retention-days: 7

  saas-image:
    # The SaaS scanner (docs/SAAS.md): the Dockerfile's `saas` target, its own GHCR
    # package, which the deploy/saas examples name by digest.
    name: SaaS scanner image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign keyless signing: the job's GitHub OIDC token gets a Fulcio certificate.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
