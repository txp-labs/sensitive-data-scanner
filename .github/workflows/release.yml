          format: spdx-json
          output-file: sensitive-data-scanner-saas-${{ needs.verify.outputs.version }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attest its SBOM (cosign, keyless)
        # Keyless: a Fulcio certificate for this workflow at this tag, logged in
        # Rekor. The signature and the SPDX attestation are pushed next to the
        # image in GHCR (docs/RELEASING.md, Verifying a release).
        env:
          IMAGE: ghcr.io/txp-labs/sensitive-data-scanner-saas@${{ steps.push.outputs.digest }}
          SBOM: sensitive-data-scanner-saas-${{ needs.verify.outputs.version }}-image.spdx.json
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}"
          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saas-image-sbom
          path: sensitive-data-scanner-saas-${{ needs.verify.outputs.version }}-image.spdx.json
          if-no-files-found: error
          retention-days: 7

  aws-publish:
    # The Lambda zip, signed with AWS Signer once in the profile's region and
    # copied to every approved region's bucket at releases/<version>/, and the
    # Lambda image copied (same digest) to ECR, which replicates it to the same
    # regions. The account and its role: deploy/artifacts/. Without the
    # repository variable ARTIFACTS_ROLE_ARN every step after the first is
    # skipped and the job passes, saying so.
    name: Sign the Lambda zip, publish it to S3 and the image to ECR
    needs: [verify, artifacts, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.gate.outputs.enabled }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARTIFACTS_ACCOUNT: "895544787721"
      HOME_REGION: us-west-2
      # Keep in step with deploy/artifacts/deploy.sh and artifacts.yaml.
      ARTIFACT_REGIONS: us-west-2 us-east-1 us-east-2 ca-central-1 eu-west-1 eu-central-1 ap-southeast-2
      BUCKET_PREFIX: txp-labs-sensitive-data-scanner
      SIGNING_PROFILE: TxpLabsSensitiveDataScanner
      SIGNING_PROFILE_VERSION_ARN: arn:aws:signer:us-west-2:895544787721:/signing-profiles/TxpLabsSensitiveDataScanner/KFG2ZbbYX5
      ECR_REPOSITORY: sensitive-data-scanner
    steps:
      - id: gate
        name: Is AWS publishing configured?
        env:
          ROLE_ARN: ${{ vars.ARTIFACTS_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::notice title=AWS publishing skipped::The repository variable ARTIFACTS_ROLE_ARN is not set: the Lambda zip is not signed with AWS Signer or uploaded to the regional buckets, and the image is not copied to ECR (deploy/artifacts/README.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "AWS publishing with ${ROLE_ARN}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
          path: dist
      - if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACTS_ROLE_ARN }}
          role-session-name: sds-release-${{ github.run_id }}
          aws-region: ${{ env.HOME_REGION }}
      - name: Sign the Lambda zip (AWS Signer) and upload it to every region
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "${ARTIFACTS_ACCOUNT}"
          name="sensitive-data-scanner-${VERSION}-lambda-python3.12-x86_64.zip"
          key="releases/${VERSION}/${name}"
          home="${BUCKET_PREFIX}-${HOME_REGION}"
          mkdir -p signed
          signed="signed/sensitive-data-scanner-${VERSION}-lambda-python3.12-x86_64-signed.zip"
          # A re-run keeps what is already published: releases/ is write-once,
          # and every region must hold the same signed bytes.
          if curl -fsS -o "${signed}" "https://${home}.s3.${HOME_REGION}.amazonaws.com/${key}"; then
            echo "::notice::${key} is already published in ${HOME_REGION}; reusing it, not signing again"
          else
            work="signing/${VERSION}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            src_version=$(aws s3api put-object --bucket "${home}" --key "${work}/unsigned.zip" \
              --body "dist/${name}" --query VersionId --output text)
            source=$(jq -nc --arg b "${home}" --arg k "${work}/unsigned.zip" --arg v "${src_version}" \
              '{s3:{bucketName:$b,key:$k,version:$v}}')
            destination=$(jq -nc --arg b "${home}" --arg p "${work}/signed-" '{s3:{bucketName:$b,prefix:$p}}')
            job=$(aws signer start-signing-job --profile-name "${SIGNING_PROFILE}" \
              --source "${source}" --destination "${destination}" --query jobId --output text)
            echo "signing job ${job}"
            aws signer wait successful-signing-job --job-id "${job}"
            # The profile version that signed it must be the one customers allow.
            profile_version=$(aws signer describe-signing-job --job-id "${job}" --query profileVersion --output text)
            test "${profile_version}" = "${SIGNING_PROFILE_VERSION_ARN##*/}"
            signed_key=$(aws signer describe-signing-job --job-id "${job}" --query signedObject.s3.key --output text)
            aws s3api get-object --bucket "${home}" --key "${signed_key}" "${signed}" > /dev/null
          fi
          sha256sum "${signed}" | awk -v n="${name}" '{print $1 "  " n}' > signed/checksum
          cat signed/checksum
          for region in ${ARTIFACT_REGIONS}; do
            bucket="${BUCKET_PREFIX}-${region}"
            for pair in "${key}=${signed}" "${key}.sha256=signed/checksum"; do
              k="${pair%%=*}"; f="${pair#*=}"
              # If-None-Match: the bucket policy refuses any other put under releases/.
              if out=$(aws s3api put-object --region "${region}" --bucket "${bucket}" --key "${k}" \
                  --body "${f}" --if-none-match '*' 2>&1); then
                echo "s3://${bucket}/${k}"
              elif grep -q PreconditionFailed <<<"${out}"; then
                echo "::notice::s3://${bucket}/${k} was already published; kept"
              else
                echo "${out}"
                exit 1
              fi
            done
            # What customers download must be the signed zip, byte for byte.
            curl -fsS "https://${bucket}.s3.${region}.amazonaws.com/${key}" | sha256sum | awk '{print $1}' > got
            test "$(cat got)" = "$(awk '{print $1}' signed/checksum)"
          done
      - name: Copy the Lambda image to ECR (replicated to every region)
        if: steps.gate.outputs.enabled == 'true'
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          registry="${ARTIFACTS_ACCOUNT}.dkr.ecr.${HOME_REGION}.amazonaws.com"
          existing=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${VERSION}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "${existing}" ] && [ "${existing}" != "None" ]; then
            if [ "${existing}" = "${DIGEST}" ]; then
              echo "::notice::${registry}/${ECR_REPOSITORY}:${VERSION} is already ${DIGEST}"
              exit 0
            fi
            # Tags are immutable: a re-run that rebuilt the image cannot replace it.
            echo "::error::${registry}/${ECR_REPOSITORY}:${VERSION} is ${existing}, not this run's ${DIGEST}"
            exit 1
          fi
          command -v skopeo > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          aws ecr get-login-password --region "${HOME_REGION}" \
            | skopeo login --username AWS --password-stdin "${registry}"
          skopeo copy --preserve-digests \
            "docker://ghcr.io/txp-labs/sensitive-data-scanner@${DIGEST}" \
            "docker://${registry}/${ECR_REPOSITORY}:${VERSION}"
          got=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${VERSION}" --query 'imageDetails[0].imageDigest' --output text)
          test "${got}" = "${DIGEST}"
          echo "${registry}/${ECR_REPOSITORY}@${DIGEST}"
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-lambda
          path: signed/*-signed.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [verify, artifacts, image, db-image, azure-image, gcp-image, saas-image, aws-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          DB_DIGEST: ${{ needs.db-image.outputs.digest }}
          AZURE_DIGEST: ${{ needs.azure-image.outputs.digest }}
          GCP_DIGEST: ${{ needs.gcp-image.outputs.digest }}
          SAAS_DIGEST: ${{ needs.saas-image.outputs.digest }}
          # "true" when aws-publish signed the zip and published it to S3 and ECR.
          AWS_PUBLISHED: ${{ needs.aws-publish.outputs.published }}
        run: |
          set -euo pipefail
          # The estate rollout templates (docs/ARCHITECTURE.md, Estate rollout).
          cp deploy/scanner.yaml deploy/estate-stackset.yaml dist/
          # The Azure deployment, compiled (docs/AZURE.md, Deploying).
          cp deploy/azure/main.json dist/sensitive-data-scanner-azure.json
          # The Google Cloud deployment, the Terraform module (docs/GCP.md, Deploying).
          tar -czf dist/sensitive-data-scanner-gcp-terraform.tar.gz -C deploy gcp
          # The SaaS scanner's deploy examples (docs/SAAS.md, Deploying).
          tar -czf dist/sensitive-data-scanner-saas-deploy.tar.gz -C deploy saas
          cd dist
          echo "ghcr.io/txp-labs/sensitive-data-scanner@${DIGEST}" > IMAGE_DIGEST
          echo "ghcr.io/txp-labs/sensitive-data-scanner-databases@${DB_DIGEST}" > DB_IMAGE_DIGEST
          echo "ghcr.io/txp-labs/sensitive-data-scanner-azure@${AZURE_DIGEST}" > AZURE_IMAGE_DIGEST
          echo "ghcr.io/txp-labs/sensitive-data-scanner-gcp@${GCP_DIGEST}" > GCP_IMAGE_DIGEST
          echo "ghcr.io/txp-labs/sensitive-data-scanner-saas@${SAAS_DIGEST}" > SAAS_IMAGE_DIGEST
          # Name every file as GitHub will serve it, so SHA256SUMS matches the
          # downloads: GitHub replaces characters other than letters, digits,
          # "-", "_" and "." with ".", which turned buildx's
          # owner~repo~id.dockerbuild record into owner.repo.id.dockerbuild (#24).
          # Both images' build records are here; each has its own id.
          for f in *; do
            safe=$(printf '%s' "$f" | LC_ALL=C sed 's/[^A-Za-z0-9._-]/./g')
            if [ "$f" != "$safe" ]; then
              test ! -e "$safe"
              mv -- "$f" "$safe"
            fi
          done
          sha256sum -- * > SHA256SUMS
          cd ..
          python3 scripts/release-notes.py "${VERSION}" "${DIGEST}" "${DB_DIGEST}" "${AZURE_DIGEST}" "${GCP_DIGEST}" "${SAAS_DIGEST}" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_TAG}" --notes-file notes.md --verify-tag
      - name: SHA256SUMS names every asset as GitHub serves it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort > served
          awk '{print $2}' dist/SHA256SUMS | sort > summed
          # Every summed file is served under that name; only SHA256SUMS itself is not summed.
          comm -23 summed served | tee missing
          test ! -s missing
          test "$(comm -13 summed served)" = "SHA256SUMS"

  npm:
    # @txp-labs/sensitive-data-spec through npm trusted publishing: npm trusts
    # this repository's release.yml (set on npmjs.com), the job's GitHub OIDC
    # token stands in for a token, and the package carries provenance. There is
    # no NPM_TOKEN. Runs once the GitHub Release exists.
    name: Publish the spec package to npm
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/spec-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later.
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || npm install -g npm@11
          npm ci --ignore-scripts
      - name: Publish with provenance
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@txp-labs/sensitive-data-spec@${VERSION}" version > /dev/null 2>&1; then
            echo "::notice::@txp-labs/sensitive-data-spec@${VERSION} is already on npm; not publishing again"
            exit 0
          fi
          # prepublishOnly checks the compiled spec, runs every vector and builds dist/.
          npm publish --provenance --access public
