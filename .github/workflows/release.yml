          path: sensitive-data-scanner-azure-${{ needs.verify.outputs.version }}-image.spdx.json
          if-no-files-found: error
          retention-days: 7

  gcp-image:
    # The Google Cloud scanner (docs/GCP.md): the Dockerfile's `gcp` target, its own
    # GHCR package, which deploy/gcp's `image` names by digest (mirrored into the
    # customer's Artifact Registry, since Cloud Run pulls from there).
    name: Google Cloud scanner image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign keyless signing: the job's GitHub OIDC token gets a Fulcio certificate.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gcp
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/txp-labs/sensitive-data-scanner-gcp:${{ needs.verify.outputs.version }}
      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/txp-labs/sensitive-data-scanner-gcp@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sensitive-data-scanner-gcp-${{ needs.verify.outputs.version }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attest its SBOM (cosign, keyless)
        # Keyless: a Fulcio certificate for this workflow at this tag, logged in
        # Rekor. The signature and the SPDX attestation are pushed next to the
        # image in GHCR (docs/RELEASING.md, Verifying a release).
        env:
          IMAGE: ghcr.io/txp-labs/sensitive-data-scanner-gcp@${{ steps.push.outputs.digest }}
          SBOM: sensitive-data-scanner-gcp-${{ needs.verify.outputs.version }}-image.spdx.json
        run: |
          set -euo pipefail
