# Release on a tag v*: build the Lambda zip, the wheels, the Lambda container
# image, the databases runner's image, the Azure scanner's image, the Google
# Cloud scanner's image and the SaaS scanner's image; push the images to GHCR,
# signed with cosign (keyless) with their SPDX SBOMs attested; sign the Lambda
# zip with AWS Signer and publish it to the release bucket in every approved
# region, and the Lambda image to ECR (aws-publish, deploy/artifacts/); attach
# SBOMs and SHA-256 checksums to a GitHub Release; publish the spec package to
# npm with provenance (docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  # Re-run the release of an existing tag with this workflow as it is on the
  # default branch (for a fix to the workflow itself). The code built is the
  # tag's.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Versions agree with the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in v[0-9]*) ;; *) echo "not a release tag"; exit 1;; esac
          version="${RELEASE_TAG#v}"
          py=$(python3 -c 'import tomllib;print(tomllib.load(open("scanner/pyproject.toml","rb"))["project"]["version"])')
          ts=$(python3 -c 'import json;print(json.load(open("packages/spec-ts/package.json"))["version"])')
          echo "tag ${version}, scanner ${py}, spec-ts ${ts}"
          test "${version}" = "${py}"
          test "${version}" = "${ts}"
          # Every other Python package in the scanner workspace (the core, ...).
          for f in scanner/*/pyproject.toml; do
            v=$(python3 -c 'import sys,tomllib;print(tomllib.load(open(sys.argv[1],"rb"))["project"]["version"])' "$f")
            echo "${f} ${v}"
            test "${version}" = "${v}"
          done
          grep -q "^## ${version} " CHANGELOG.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  artifacts:
    name: Zip, wheel and SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          scripts/build-lambda-zip.sh "${VERSION}" out
          # The wheel only: the sdist cannot carry the spec and licenses from
          # outside scanner/. The source release is the tag itself.
          # The scanner's wheel and its core's (the scanner depends on the core),
          # and the databases runner's (it depends on the core too).
          (cd scanner && uv build --wheel --package sensitive-data-scanner-core --out-dir ../out \
            && uv build --wheel --package sensitive-data-scanner --out-dir ../out \
            && uv build --wheel --package sensitive-data-scanner-db --out-dir ../out \
            && uv build --wheel --package sensitive-data-scanner-azure --out-dir ../out \
            && uv build --wheel --package sensitive-data-scanner-gcp --out-dir ../out \
            && uv build --wheel --package sensitive-data-scanner-saas --out-dir ../out)
          mkdir -p sbom-src && (cd sbom-src && unzip -q ../out/*-lambda-*.zip)
      - name: SBOM of the Lambda zip (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: sbom-src
          format: spdx-json
          output-file: out/sensitive-data-scanner-${{ needs.verify.outputs.version }}-lambda.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: out/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Container image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign keyless signing: the job's GitHub OIDC token gets a Fulcio certificate.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/txp-labs/sensitive-data-scanner:${{ needs.verify.outputs.version }}
      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/txp-labs/sensitive-data-scanner@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sensitive-data-scanner-${{ needs.verify.outputs.version }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attest its SBOM (cosign, keyless)
        # Keyless: a Fulcio certificate for this workflow at this tag, logged in
        # Rekor. The signature and the SPDX attestation are pushed next to the
        # image in GHCR (docs/RELEASING.md, Verifying a release).
        env:
          IMAGE: ghcr.io/txp-labs/sensitive-data-scanner@${{ steps.push.outputs.digest }}
          SBOM: sensitive-data-scanner-${{ needs.verify.outputs.version }}-image.spdx.json
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}"
          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom
          path: sensitive-data-scanner-${{ needs.verify.outputs.version }}-image.spdx.json
          if-no-files-found: error
          retention-days: 7

  db-image:
    # The databases runner (docs/DATABASES.md): the Dockerfile's `db` target with
    # every engine's driver, its own GHCR package.
    name: Databases runner image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
