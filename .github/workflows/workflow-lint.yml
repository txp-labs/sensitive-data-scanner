# Workflow lint with zizmor, run as a checksum-verified binary. The gate is
# medium severity and medium confidence. Version and digest are pinned
# together; bump both or neither.
name: Workflow Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIZMOR_VERSION: 1.30.1
  ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

jobs:
  zizmor:
    name: Workflow Lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o /tmp/zizmor.tar.gz "$url"
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zizmor.tar.gz -C /tmp zizmor
          sudo install -m 0755 /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version

      # GH_TOKEN turns on the online audits: that a pinned commit belongs to
      # the action's repository, and that a pinned version has no advisory.
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zizmor --no-progress --min-severity medium --min-confidence medium \
            --format github .github/workflows/*.yml
