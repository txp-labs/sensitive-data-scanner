# Contributor License Agreement check (CLA Assistant Lite).
# A first-time contributor comments the sentence below on their pull request.
# Signatures are recorded in cla/signatures/v0.1.json on the `cla-signatures`
# branch. Maintainers and anyone listed in the allowlist are exempt.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: cla/signatures/v0.1.json
          path-to-document: https://github.com/txp-labs/sensitive-data-scanner/blob/main/cla/INDIVIDUAL.md
          branch: cla-signatures
          allowlist: crmarr,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/txp-labs/sensitive-data-scanner/blob/main/cla/INDIVIDUAL.md)
            (you keep your copyright; you grant txp-labs a license) and reply with the sentence below.
            Contributing for an employer? See the [Corporate CLA](https://github.com/txp-labs/sensitive-data-scanner/blob/main/cla/CORPORATE.md).
